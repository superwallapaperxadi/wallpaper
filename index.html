<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Core Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.16);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-main);
      color: #ffffff;
      cursor: none;
      position: relative;
    }

    /* Pixel-Perfect Custom Cursor */
    .cursor-center-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
      will-change: transform;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .cursor-ambient-halo {
      position: fixed;
      top: 0;
      left: 0;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 199;
      will-change: transform, width, height, border-color;
      transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.2s ease,
                  background-color 0.2s ease;
    }

    body:active .cursor-ambient-halo {
      width: 68px;
      height: 68px;
      border-color: rgba(255, 255, 255, 0.8);
      background-color: rgba(255, 255, 255, 0.03);
    }

    body.cursor-interactive .cursor-ambient-halo {
      width: 54px;
      height: 54px;
      border-color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Architectural Frame Lines */
    .view-frame {
      position: fixed;
      inset: 28px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .c-tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .c-tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .c-br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Swiss Clean HUD */
    .hud {
      position: absolute;
      inset: 0;
      padding: 60px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
    }

    /* Top Left Hover App Drawer */
    .apps-dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 8px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-subtle);
      border-radius: 40px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      width: fit-content;
    }

    .apps-dock:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border-light);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .apps-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      cursor: none;
    }

    .apps-trigger svg {
      width: 14px;
      height: 14px;
      fill: rgba(255, 255, 255, 0.7);
      transition: transform 0.3s ease;
    }

    .apps-dock:hover .apps-trigger svg {
      transform: rotate(90deg);
      fill: #ffffff;
    }

    .apps-label {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.2s ease;
    }

    .apps-dock:hover .apps-label {
      color: #ffffff;
    }

    .apps-list {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apps-dock:hover .apps-list {
      max-width: 200px;
      opacity: 1;
      transform: translateX(0);
      margin-left: 4px;
    }

    .app-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: none;
      text-decoration: none;
    }

    .app-btn svg {
      width: 17px;
      height: 17px;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .app-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px) scale(1.08);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .app-btn:active {
      transform: scale(0.94);
    }

    /* Minimal Time Block */
    .clock-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .time-digits {
      font-family: var(--font-mono);
      font-size: 2.1rem;
      font-weight: 400;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
    }

    .time-date {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
    }

    .row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .telemetry {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pip {
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
    }

    .axiom {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 800px) {
      .hud { padding: 36px; }
      .view-frame { inset: 14px; }
      .axiom { display: none; }
      .time-digits { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="cursor-center-dot" id="cursorDot"></div>
  <div class="cursor-ambient-halo" id="cursorHalo"></div>

  <div class="view-frame">
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>
  </div>

  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="row-top">
      
      <!-- Top Left Hover Menu -->
      <div class="apps-dock" id="appsDock">
        <div class="apps-trigger">
          <svg viewBox="0 0 24 24">
            <path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

        <div class="apps-list">
          <!-- Google Official SVG -->

              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>

          <!-- Pinterest Official SVG -->
          <a href="https://www.pinterest.com" target="_blank" rel="noopener noreferrer" class="app-btn interactive-target" title="Pinterest">
            <svg viewBox="0 0 24 24">
              <path fill="#E60023" d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345-.09.375-.291 1.199-.332 1.357-.053.211-.174.256-.402.154-1.498-.697-2.435-2.887-2.435-4.647 0-3.785 2.75-7.262 7.929-7.262 4.163 0 7.398 2.967 7.398 6.931 0 4.136-2.607 7.464-6.227 7.464-1.216 0-2.359-.631-2.75-1.378l-.748 2.853c-.271 1.043-1.002 2.35-1.492 3.146C9.57 23.812 10.763 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/>
            </svg>

          <!-- Instagram Official Multi-Color Gradient SVG -->
          <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="app-btn interactive-target" title="Instagram">
            <svg viewBox="0 0 24 24">
              <defs>
                <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#FFDC80"/>

                  <stop offset="75%" stop-color="#E1306C"/>

                </linearGradient>
              </defs>
              <path fill="url(#ig-grad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Clock -->
      <div class="clock-cluster">
        <div class="time-digits" id="clockDigits">00:00:00</div>
        <div class="time-date" id="clockDate">INITIALIZING</div>
      </div>
    </div>

    <div class="row-bottom">
      <div class="telemetry">
        <span class="pip"></span>
        <span>UPTIME</span>
        <span id="sessionTimer" style="color: #ffffff;">00:00:00</span>
      </div>
      <div class="axiom">FOCUS IS A VECTOR</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const cursorDot = document.getElementById('cursorDot');
    const cursorHalo = document.getElementById('cursorHalo');
    const clockDigits = document.getElementById('clockDigits');
    const clockDate = document.getElementById('clockDate');
    const sessionTimer = document.getElementById('sessionTimer');
    const appsDock = document.getElementById('appsDock');

    let width = 0;
    let height = 0;

    const mouse = {
      x: -2000,
      y: -2000,
      tx: -2000,
      ty: -2000,
      radius: 155,
      isDown: false,
      speed: 0,
      prevX: 0,
      prevY: 0
    };

    const STRIDE = 8;
    let pCount = 0;
    let pBuffer = null;

    const MAX_SHOCKS = 3;
    const shocks = new Float32Array(MAX_SHOCKS * 5);
    let shockIdx = 0;

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const startTime = performance.now();

    function updateClock(now) {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');

      clockDigits.textContent = `${h}:${m}:${s}`;
      clockDate.textContent = `${days[d.getDay()]} / ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;

      const sec = Math.floor((now - startTime) / 1000);
      const sh = String(Math.floor(sec / 3600)).padStart(2, '0');
      const sm = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      sessionTimer.textContent = `${sh}:${sm}:${ss}`;
    }

    function initTypography() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      const off = document.createElement('canvas');
      off.width = width;
      off.height = height;
      const offCtx = off.getContext('2d');

      const fontSize = Math.min(width * 0.125, 150);
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.font = `900 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
      offCtx.fillText('FOCUS', width / 2, height / 2);

      const img = offCtx.getImageData(0, 0, width, height).data;
      const step = Math.max(Math.floor(width / 340), 4);
      const coords = [];

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const idx = (y * width + x) * 4 + 3;
          if (img[idx] > 128) {
            coords.push(x, y);
          }
        }
      }

      pCount = coords.length / 2;
      pBuffer = new Float32Array(pCount * STRIDE);

      for (let i = 0; i < pCount; i++) {
        const o = i * STRIDE;
        const ox = coords[i * 2];
        const oy = coords[i * 2 + 1];

        pBuffer[o] = ox + (Math.random() - 0.5) * 30;
        pBuffer[o + 1] = oy + (Math.random() - 0.5) * 30;
        pBuffer[o + 2] = ox;
        pBuffer[o + 3] = oy;
        pBuffer[o + 4] = 0;
        pBuffer[o + 5] = 0;
        pBuffer[o + 6] = Math.random() * 1.3 + 0.9;
        pBuffer[o + 7] = Math.random() * 0.35 + 0.55;
      }
    }

    function addShockwave(x, y) {
      const o = shockIdx * 5;
      shocks[o] = x;
      shocks[o + 1] = y;
      shocks[o + 2] = 2;
      shocks[o + 3] = 320;
      shocks[o + 4] = 0.75;
      shockIdx = (shockIdx + 1) % MAX_SHOCKS;
    }

    let prevTime = performance.now();

    function render(now) {
      const dt = Math.min((now - prevTime) / 1000, 0.033);
      prevTime = now;

      mouse.x += (mouse.tx - mouse.x) * 0.22;
      mouse.y += (mouse.ty - mouse.y) * 0.22;

      cursorDot.style.transform = `translate3d(${mouse.tx - 2.5}px, ${mouse.ty - 2.5}px, 0)`;
      cursorHalo.style.transform = `translate3d(${mouse.x - cursorHalo.offsetWidth * 0.5}px, ${mouse.y - cursorHalo.offsetHeight * 0.5}px, 0)`;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      updateClock(now);

      for (let i = 0; i < MAX_SHOCKS; i++) {
        const o = i * 5;
        const alpha = shocks[o + 4];
        if (alpha > 0.01) {
          shocks[o + 2] += (shocks[o + 3] - shocks[o + 2]) * 0.12;
          shocks[o + 4] *= 0.93;

          ctx.save();
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(shocks[o], shocks[o + 1], shocks[o + 2], 0, 6.283);
          ctx.stroke();
          ctx.restore();
        }
      }

      const mx = mouse.x;
      const my = mouse.y;
      const mRad = mouse.radius;
      const mRadSq = mRad * mRad;
      const isDown = mouse.isDown;
      const speedMult = Math.min(mouse.speed * 0.04, 3.5);

      for (let i = 0; i < pCount; i++) {
        const o = i * STRIDE;
        let px = pBuffer[o];
        let py = pBuffer[o + 1];
        const ox = pBuffer[o + 2];
        const oy = pBuffer[o + 3];
        let vx = pBuffer[o + 4];
        let vy = pBuffer[o + 5];
        const size = pBuffer[o + 6];
        const alpha = pBuffer[o + 7];

        const dx = mx - px;
        const dy = my - py;
        const distSq = dx * dx + dy * dy;

        if (distSq < mRadSq && distSq > 0.01) {
          const dist = Math.sqrt(distSq);
          const force = (1 - dist / mRad);

          if (isDown) {
            const angle = Math.atan2(dy, dx) + 1.57;
            vx += (dx / dist) * force * 30 + Math.cos(angle) * force * 15;
            vy += (dy / dist) * force * 30 + Math.sin(angle) * force * 15;
          } else {
            const angle = Math.atan2(dy, dx);
            const push = force * (18 + speedMult * 8);
            vx -= Math.cos(angle) * push;
            vy -= Math.sin(angle) * push;
          }
        }

        const spring = 8.8;
        const damping = Math.pow(0.83, dt * 60);

        vx += (ox - px) * spring * dt;
        vy += (oy - py) * spring * dt;
        vx *= damping;
        vy *= damping;

        px += vx;
        py += vy;

        pBuffer[o] = px;
        pBuffer[o + 1] = py;
        pBuffer[o + 4] = vx;
        pBuffer[o + 5] = vy;

        const vel = Math.hypot(vx, vy);
        const finalAlpha = Math.min(alpha + vel * 0.05, 1.0);

        ctx.fillStyle = finalAlpha > 0.85 ? '#ffffff' : `rgba(255, 255, 255, ${finalAlpha.toFixed(2)})`;
        ctx.fillRect(px - size * 0.5, py - size * 0.5, size, size);
      }

      mouse.speed *= 0.88;
      requestAnimationFrame(render);
    }

    // Hardware Event Handlers
    window.addEventListener('resize', initTypography);

    window.addEventListener('mousemove', (e) => {
      mouse.speed = Math.hypot(e.clientX - mouse.prevX, e.clientY - mouse.prevY);
      mouse.prevX = mouse.tx = e.clientX;
      mouse.prevY = mouse.ty = e.clientY;
    });

    window.addEventListener('mousedown', (e) => {
      // Buttons par click hone par particle shockwave suppress ho sake
      if (e.target.closest('.interactive-target') || e.target.closest('.apps-dock')) {
        return;
      }
      mouse.isDown = true;
      mouse.radius = 240;
      addShockwave(e.clientX, e.clientY);

      for (let i = 0; i < pCount; i++) {
        const o = i * STRIDE;
        const dx = pBuffer[o] - e.clientX;
        const dy = pBuffer[o + 1] - e.clientY;
        const distSq = dx * dx + dy * dy;
        if (distSq < 62500 && distSq > 1) {
          const dist = Math.sqrt(distSq);
          const push = (1 - dist / 250) * 48;
          pBuffer[o + 4] += (dx / dist) * push;
          pBuffer[o + 5] += (dy / dist) * push;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      mouse.isDown = false;
      mouse.radius = 155;
    });

    window.addEventListener('mouseleave', () => {
      mouse.tx = -2000;
      mouse.ty = -2000;
      mouse.isDown = false;
    });

    // Custom Interactive Hover Feedback
    document.querySelectorAll('.interactive-target, .apps-dock').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('cursor-interactive'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-interactive'));
    });

    initTypography();
    requestAnimationFrame(render);
  </script>
</body>
</html>
