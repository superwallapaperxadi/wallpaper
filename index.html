<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Monolith Core — Precision Chrono Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.2);
      --glass-surface: rgba(10, 10, 14, 0.76);
      --glass-surface-dense: rgba(12, 12, 16, 0.96);
      --accent-blue: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-main);
      color: #ffffff;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle 650px at var(--mx, -500px) var(--my, -500px), rgba(255, 255, 255, 0.04), transparent 75%);
    }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .view-frame {
      position: fixed;
      inset: 20px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .c-tl { top: -1px; left: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .c-tr { top: -1px; right: -1px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .c-br { bottom: -1px; right: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    .hud {
      position: absolute;
      inset: 0;
      padding: 38px 46px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      position: relative;
    }

    .left-cluster {
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
      max-width: calc(100vw - 320px);
      z-index: 20;
    }

    .docks-cluster {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .apps-dock {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px 4px 6px;
      background: var(--glass-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
      width: fit-content;
      max-width: 100%;
    }

    .apps-dock:hover {
      background: rgba(18, 18, 22, 0.94);
      border-color: var(--border-light);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .apps-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .apps-trigger svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.65);
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.2s ease;
    }

    .apps-dock:hover .apps-trigger svg {
      transform: rotate(90deg);
      stroke: #ffffff;
    }

    .apps-label {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      transition: color 0.2s ease;
    }

    .apps-dock:hover .apps-label {
      color: #ffffff;
    }

    .apps-list {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 0;
      opacity: 0;
      pointer-events: none;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-right: 4px;
      transition: max-width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.28s ease,
                  margin-left 0.3s ease;
    }

    .apps-list::-webkit-scrollbar {
      display: none;
    }

    .apps-dock:hover .apps-list {
      max-width: min(680px, calc(100vw - 420px));
      opacity: 1;
      pointer-events: auto;
      margin-left: 6px;
    }

    .app-btn {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      overflow: hidden;
    }

    .app-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transition: transform 0.25s ease;
    }

    .app-btn svg {
      width: 15px;
      height: 15px;
      object-fit: contain;
    }

    .app-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.7);
      transform: translateY(-2px) scale(1.1);
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.15);
    }

    .app-btn:hover img {
      transform: scale(1.12);
    }

    .app-btn:active {
      transform: scale(0.92);
    }

    .app-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #ffffff;
      background: rgba(10, 10, 14, 0.96);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 400;
    }

    .app-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .add-app-btn {
      width: 32px;
      height: 32px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.5);
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-app-btn.visible {
      display: flex;
    }

    .add-app-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
      transform: scale(1.08);
    }

    .add-app-btn:hover svg {
      stroke: #000000;
    }

    .add-app-btn svg {
      width: 13px;
      height: 13px;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .search-cluster {
      display: flex;
      align-items: center;
      position: relative;
      width: 360px;
      max-width: 100%;
      margin-top: 4px;
    }

    .search-capsule {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      background: var(--glass-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .search-capsule:focus-within {
      background: rgba(18, 18, 24, 0.96);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .bing-brand-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.6rem;
      font-family: var(--font-mono);
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .bing-brand-badge svg {
      width: 14px;
      height: 14px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.8px;
      color: #ffffff;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .search-hint {
      font-family: var(--font-mono);
      font-size: 0.54rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
      border: 1px solid var(--border-subtle);
      padding: 2px 5px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .top-right-gauge {
      display: flex;
      align-items: center;
      gap: 18px;
      pointer-events: auto;
      z-index: 20;
    }

    .dial-clock-card {
      position: relative;
      width: 112px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(20, 20, 26, 0.85) 0%, rgba(8, 8, 11, 0.95) 75%);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.02);
    }

    .dial-svg-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .dial-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 2.2;
    }

    .dial-sec-progress {
      fill: none;
      stroke: rgba(255, 255, 255, 0.7);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 326.7;
      stroke-dashoffset: 326.7;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
      transition: stroke-dashoffset 0.05s linear;
    }

    .dial-needle-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-origin: center;
    }

    .dial-needle {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 1.5px;
      height: 46px;
      background: linear-gradient(to bottom, #ffffff 0%, rgba(255, 255, 255, 0.1) 80%, transparent 100%);
      transform: translateX(-50%);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    .dial-needle-dot {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
      transform: translateX(-50%);
      box-shadow: 0 0 10px #ffffff;
    }

    .dial-inner-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }

    .dial-time-main {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      line-height: 1;
    }

    .dial-sec-badge {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.5);
    }

    .dial-calendar-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .dial-cal-day {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .dial-cal-date {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
    }

    /* CENTER FOCUS VECTOR: Interactive Kinetic Core */
    .center-focus-bay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: auto;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: crosshair;
    }

    .focus-text-primary {
      font-family: var(--font-main);
      font-size: clamp(2.8rem, 6.6vw, 5.8rem);
      font-weight: 900;
      letter-spacing: clamp(6px, 1.6vw, 16px);
      text-transform: uppercase;
      line-height: 1;
      text-indent: clamp(6px, 1.6vw, 16px);
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 32%, #64748b 50%, #ffffff 68%, #94a3b8 100%);
      background-size: 240% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.25));
      transition: filter 0.25s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .center-focus-bay:hover .focus-text-primary {
      filter: drop-shadow(0 0 55px rgba(255, 255, 255, 0.65)) drop-shadow(0 0 20px rgba(56, 189, 248, 0.35));
      transform: scale(1.025);
      animation: metallicShimmer 2.2s linear infinite;
    }

    @keyframes metallicShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 240% center; }
    }

    .focus-sub-text {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      text-indent: 6px;
      transition: color 0.3s ease;
    }

    .center-focus-bay:hover .focus-sub-text {
      color: rgba(255, 255, 255, 0.75);
    }

    .row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
    }

    .telemetry {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pip {
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
    }

    .telemetry-val {
      color: #ffffff;
      font-weight: 600;
    }

    .axiom {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
    }

    .minimized-dock-trigger {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(14, 14, 18, 0.92);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      padding: 7px 15px 7px 11px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .minimized-dock-trigger.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .minimized-dock-trigger:hover {
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.3);
    }

    .minimized-dock-trigger:hover .arrow-circle {
      background: #000000;
      color: #ffffff;
    }

    .minimized-dock-trigger:hover .minimized-text,
    .minimized-dock-trigger:hover .minimized-badge {
      color: #000000;
    }

    .arrow-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .arrow-circle svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .minimized-text {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      transition: color 0.2s ease;
    }

    .minimized-badge {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      font-weight: 800;
      color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 10px;
    }

    .hud-browser-window {
      position: fixed;
      inset: 48px;
      background: var(--glass-surface-dense);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96) translateY(24px);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-browser-window.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    .hud-browser-window.minimized {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7) translateY(120px);
    }

    .browser-header {
      height: 48px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }

    .window-controls-traffic {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .traffic-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .btn-close { background: #ff5f56; }
    .btn-minimize { background: #ffbd2e; }
    .btn-expand { background: #27c93f; }

    .traffic-btn:hover {
      transform: scale(1.15);
    }

    .browser-omnibar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 520px;
      max-width: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 5px 12px;
    }

    .browser-omnibar svg {
      width: 13px;
      height: 13px;
      stroke: rgba(255, 255, 255, 0.4);
    }

    .browser-omnibar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.5px;
    }

    .window-external-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-external-popout {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: rgba(255, 255, 255, 0.7);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-external-popout:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-external-popout svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .browser-body {
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
      background: #000000;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      overflow: hidden;
    }

    .browser-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .custom-modal {
      width: 440px;
      background: rgba(14, 14, 18, 0.96);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalSlide {

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const ambientGlow = document.getElementById('ambientGlow');
    const sessionTimer = document.getElementById('sessionTimer');
    const actualUptime = document.getElementById('actualUptime');

    const dialTimeDigits = document.getElementById('dialTimeDigits');
    const dialSecBadge = document.getElementById('dialSecBadge');
    const dialDay = document.getElementById('dialDay');
    const dialDate = document.getElementById('dialDate');
    const dialSecArc = document.getElementById('dialSecArc');
    const dialNeedleWrap = document.getElementById('dialNeedleWrap');

    const bingSearchForm = document.getElementById('bingSearchForm');
    const bingQuery = document.getElementById('bingQuery');
    const hudBrowser = document.getElementById('hudBrowser');
    const browserFrame = document.getElementById('browserFrame');
    const hudOmniUrl = document.getElementById('hudOmniUrl');
    const btnWinClose = document.getElementById('btnWinClose');
    const btnWinMinimize = document.getElementById('btnWinMinimize');
    const btnWinExpand = document.getElementById('btnWinExpand');
    const btnWinExternalPopout = document.getElementById('btnWinExternalPopout');
    const minimizedRestoreBtn = document.getElementById('minimizedRestoreBtn');
    const minimizedQueryTag = document.getElementById('minimizedQueryTag');
    const focusCenterBay = document.getElementById('focusCenterBay');
    const focusText = document.getElementById('focusText');

    const modalBackdrop = document.getElementById('modalBackdrop');
    const addAppBtnApps = document.getElementById('addAppBtn-apps');
    const addAppBtnBiz = document.getElementById('addAppBtn-biz');
    const btnCancel = document.getElementById('btnCancel');
    const btnSave = document.getElementById('btnSave');
    const appNameInput = document.getElementById('appName');
    const appUrlInput = document.getElementById('appUrl');
    const appIconUrlInput = document.getElementById('appIconUrl');
    const dockTargetSelect = document.getElementById('dockTarget');

    let width = 0;
    let height = 0;
    let dpr = 1;
    const sessionStart = performance.now();
    const systemEpochTime = Date.now() - performance.now();
    let lastTime = performance.now();

    // -------------------------------------------------------------
    // SHAKE DETECTION & HIGH-VOLTAGE TESLA ARCS
    // -------------------------------------------------------------
    const mouse = {
      x: -1000,
      y: -1000,
      prevX: -1000,
      prevY: -1000,
      shakeHist: [],
      shakeIntensity: 0
    };

    let lightningActive = false;
    let lightningEnergy = 0;
    let lightningChains = [];

    function triggerTeslaNetwork(cx, cy, intensity) {
      lightningChains = [];
      const branches = Math.min(Math.floor(intensity * 4) + 2, 7);
      
      for (let b = 0; b < branches; b++) {
        const segs = Math.floor(Math.random() * 8) + 8;
        const pts = [{ x: cx, y: cy }];
        let curX = cx;
        let curY = cy;
        const angle = (Math.PI * 2 * b) / branches + (Math.random() - 0.5) * 0.8;
        const length = (Math.random() * 16 + 18) * (0.8 + intensity * 0.4);

        for (let s = 0; s < segs; s++) {
          const segAngle = angle + (Math.random() - 0.5) * 1.5;
          curX += Math.cos(segAngle) * length;
          curY += Math.sin(segAngle) * length;
          pts.push({ x: curX, y: curY });
        }
        lightningChains.push(pts);
      }
    }

    window.addEventListener('mousemove', (e) => {
      const now = performance.now();
      const dx = e.clientX - mouse.prevX;
      const dy = e.clientY - mouse.prevY;
      const dist = Math.hypot(dx, dy);

      mouse.x = e.clientX;
      mouse.y = e.clientY;

      ambientGlow.style.setProperty('--mx', `${e.clientX}px`);
      ambientGlow.style.setProperty('--my', `${e.clientY}px`);

      // Dynamic shake window detector
      mouse.shakeHist.push({ time: now, dist });
      while (mouse.shakeHist.length > 0 && (now - mouse.shakeHist[0].time) > 350) {
        mouse.shakeHist.shift();
      }

      let totalDist = 0;
      for (let i = 0; i < mouse.shakeHist.length; i++) {
        totalDist += mouse.shakeHist[i].dist;
      }

      if (totalDist > 380 && mouse.shakeHist.length > 6) {
        lightningActive = true;
        lightningEnergy = 1.0;
        triggerTeslaNetwork(e.clientX, e.clientY, Math.min(totalDist / 500, 2.0));
        mouse.shakeHist = [];
      }

      // Magnetic interaction with center title
      if (isHoveringCenter) {
        for (let i = 0; i < 2; i++) {
          spawnCrystallineParticle(e.clientX, e.clientY);
        }
      }

      mouse.prevX = e.clientX;
      mouse.prevY = e.clientY;
    }, { passive: true });

    // -------------------------------------------------------------
    // "DO MORE FOCUS" CRYSTALLINE PARTICLE ENGINE
    // -------------------------------------------------------------
    const MAX_CRYSTALS = 150;
    const CRYSTAL_STRIDE = 7; // [x, y, vx, vy, size, alpha, life]
    const crystalBuffer = new Float32Array(MAX_CRYSTALS * CRYSTAL_STRIDE);
    let crystalCount = 0;
    let isHoveringCenter = false;

    function spawnCrystallineParticle(x, y) {
      if (crystalCount >= MAX_CRYSTALS) return;
      const o = crystalCount * CRYSTAL_STRIDE;
      crystalBuffer[o] = x + (Math.random() - 0.5) * 180;
      crystalBuffer[o + 1] = y + (Math.random() - 0.5) * 50;
      crystalBuffer[o + 2] = (Math.random() - 0.5) * 2.2;
      crystalBuffer[o + 3] = -Math.random() * 2.5 - 0.6;
      crystalBuffer[o + 4] = Math.random() * 2.8 + 1.2;
      crystalBuffer[o + 5] = Math.random() * 0.8 + 0.2;
      crystalBuffer[o + 6] = 1.0;
      crystalCount++;
    }

    focusCenterBay.addEventListener('mouseenter', () => {
      isHoveringCenter = true;
      for (let i = 0; i < 18; i++) {
        spawnCrystallineParticle(width / 2, height / 2);
      }
    });

    focusCenterBay.addEventListener('mouseleave', () => {
      isHoveringCenter = false;
    });

    // -------------------------------------------------------------
    // CLOCK, REAL WINDOWS ON-SCREEN UPTIME & TELEMETRY
    // -------------------------------------------------------------
    const daysArr = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const monthsArr = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const circumference = 2 * Math.PI * 52;

    function updateClocks(now) {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = d.getSeconds();
      const exactSec = s + d.getMilliseconds() / 1000;

      dialTimeDigits.textContent = `${h}:${m}`;
      dialSecBadge.textContent = `${String(s).padStart(2, '0')}s`;

      const progress = exactSec / 60;
      dialSecArc.style.strokeDashoffset = circumference * (1 - progress);
      dialNeedleWrap.style.transform = `rotate(${progress * 360}deg)`;

      dialDay.textContent = daysArr[d.getDay()];
      dialDate.textContent = `${String(d.getDate()).padStart(2, '0')} ${monthsArr[d.getMonth()]} ${d.getFullYear()}`;

      // In-App Session Uptime
      const secElapsed = Math.floor((now - sessionStart) / 1000);
      const sh = String(Math.floor(secElapsed / 3600)).padStart(2, '0');
      const sm = String(Math.floor((secElapsed % 3600) / 60)).padStart(2, '0');
      const ss = String(secElapsed % 60).padStart(2, '0');
      sessionTimer.textContent = `${sh}:${sm}:${ss}`;

      // Actual Windows OS On-Screen Time (Based on DOM high-res hardware clock)
      const rawPcSec = Math.floor(now / 1000);
      const ph = String(Math.floor(rawPcSec / 3600)).padStart(2, '0');
      const pm = String(Math.floor((rawPcSec % 3600) / 60)).padStart(2, '0');
      const ps = String(rawPcSec % 60).padStart(2, '0');
      actualUptime.textContent = `${ph}:${pm}:${ps}`;
    }

    // -------------------------------------------------------------
    // CLEAN IN-HUD BROWSER (NO REDUNDANT PILLS)
    // -------------------------------------------------------------
    let currentBrowserQuery = '';

    function openBrowser(query) {
      currentBrowserQuery = query;
      const targetUrl = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;

      hudOmniUrl.value = targetUrl;
      btnWinExternalPopout.href = targetUrl;
      browserFrame.src = targetUrl;

      hudBrowser.classList.remove('minimized');
      hudBrowser.classList.add('active');
      minimizedRestoreBtn.classList.remove('active');
    }

    bingSearchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = bingQuery.value.trim();
      if (!q) return;
      openBrowser(q);
      bingQuery.blur();
    });

    btnWinClose.addEventListener('click', () => {
      hudBrowser.classList.remove('active', 'minimized');
      browserFrame.src = 'about:blank';
      minimizedRestoreBtn.classList.remove('active');
    });

    btnWinMinimize.addEventListener('click', () => {
      hudBrowser.classList.remove('active');
      hudBrowser.classList.add('minimized');
      minimizedQueryTag.textContent = currentBrowserQuery.length > 12 
        ? currentBrowserQuery.slice(0, 10) + '..' 
        : (currentBrowserQuery || 'Bing');
      minimizedRestoreBtn.classList.add('active');
    });

    btnWinExpand.addEventListener('click', () => {
      hudBrowser.style.inset = (hudBrowser.style.inset === '12px') ? '48px' : '12px';
    });

    minimizedRestoreBtn.addEventListener('click', () => {
      hudBrowser.classList.remove('minimized');
      hudBrowser.classList.add('active');
      minimizedRestoreBtn.classList.remove('active');
    });

    window.addEventListener('keydown', (e) => {
      if ((e.key === '/' || (e.ctrlKey && e.key.toLowerCase() === 'k')) && document.activeElement !== bingQuery) {
        e.preventDefault();
        bingQuery.focus();
        bingQuery.select();
      }
      if (e.key === 'Escape' && hudBrowser.classList.contains('active')) {
        btnWinMinimize.click();
      }
    });

    // -------------------------------------------------------------
    // DOCK & CUSTOM NODES
    // -------------------------------------------------------------
    function loadSavedApps() {
      try {
        const saved = JSON.parse(localStorage.getItem('aethelgard_nodes_v5') || '[]');
        saved.forEach(app => renderCustomApp(app));
      } catch(e) {}
    }

    function renderCustomApp(app) {
      const isBiz = app.dock === 'biz';
      const targetList = isBiz ? document.getElementById('listBiz') : document.getElementById('listApps');
      const addBtn = isBiz ? addAppBtnBiz : addAppBtnApps;

      const a = document.createElement('a');
      a.href = app.url;
      a.className = 'app-btn';
      a.dataset.tooltip = app.name;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      if (app.icon) {
        const img = document.createElement('img');
        img.src = app.icon;
        img.alt = app.name;
        a.appendChild(img);
      } else {
        a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`;
      }

      targetList.insertBefore(a, addBtn);
    }

    function saveCustomApp(app) {
      try {
        const saved = JSON.parse(localStorage.getItem('aethelgard_nodes_v5') || '[]');
        saved.push(app);
        localStorage.setItem('aethelgard_nodes_v5', JSON.stringify(saved));
        renderCustomApp(app);
      } catch(e) {}
    }

    addAppBtnApps.addEventListener('click', () => { dockTargetSelect.value = 'apps'; modalBackdrop.classList.add('open'); appNameInput.focus(); });
    addAppBtnBiz.addEventListener('click', () => { dockTargetSelect.value = 'biz'; modalBackdrop.classList.add('open'); appNameInput.focus(); });

    btnCancel.addEventListener('click', () => {
      modalBackdrop.classList.remove('open');
      appNameInput.value = '';
      appUrlInput.value = '';
      appIconUrlInput.value = '';
    });

    btnSave.addEventListener('click', () => {
      const name = appNameInput.value.trim();
      const url = appUrlInput.value.trim();
      const icon = appIconUrlInput.value.trim();
      if (!name || !url) return;

      saveCustomApp({ name, url, icon, dock: dockTargetSelect.value });
      btnCancel.click();
    });

    function setupDockShakeDetection(dockEl, addBtnEl) {
      let shakeCount = 0;
      let lastDir = 0;
      let lastTime = 0;

      dockEl.addEventListener('mousemove', (e) => {
        const dx = e.movementX;
        const now = performance.now();
        if (Math.abs(dx) > 10) {
          const dir = Math.sign(dx);
          if (dir !== lastDir && (now - lastTime) < 320) {
            shakeCount++;
            if (shakeCount >= 4) addBtnEl.classList.add('visible');
          }
          lastDir = dir;
          lastTime = now;
        }
      });
    }

    setupDockShakeDetection(document.getElementById('dockApps'), addAppBtnApps);
    setupDockShakeDetection(document.getElementById('dockBiz'), addAppBtnBiz);

    // -------------------------------------------------------------
    // STAR DUST BACKGROUND
    // -------------------------------------------------------------
    const STAR_COUNT = 70;
    const starBuffer = new Float32Array(STAR_COUNT * 4);
    for (let i = 0; i < STAR_COUNT; i++) {
      starBuffer[i * 4] = Math.random();
      starBuffer[i * 4 + 1] = Math.random();
      starBuffer[i * 4 + 2] = Math.random() * 0.0003 + 0.00008;
      starBuffer[i * 4 + 3] = Math.random() * 0.35 + 0.08;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // -------------------------------------------------------------
    // HIGH PRECISION RENDER LOOP
    // -------------------------------------------------------------
    function render(now) {
      const rawDt = (now - lastTime) / 1000;
      lastTime = now;
      const dt = Math.min(rawDt, 0.05);

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // Background Dust
      for (let i = 0; i < STAR_COUNT; i++) {
        const o = i * 4;
        starBuffer[o + 1] -= starBuffer[o + 2];
        if (starBuffer[o + 1] < 0) starBuffer[o + 1] = 1;

        ctx.fillStyle = `rgba(255, 255, 255, ${starBuffer[o + 3]})`;
        ctx.fillRect(starBuffer[o] * width, starBuffer[o + 1] * height, 1.2, 1.2);
      }

      // Crystalline Particle Matrix
      if (crystalCount > 0) {
        ctx.save();
        for (let i = 0; i < crystalCount; i++) {
          const o = i * CRYSTAL_STRIDE;
          crystalBuffer[o] += crystalBuffer[o + 2];
          crystalBuffer[o + 1] += crystalBuffer[o + 3];
          crystalBuffer[o + 6] -= dt * 1.3;

          if (crystalBuffer[o + 6] <= 0) {
            const lastO = (crystalCount - 1) * CRYSTAL_STRIDE;
            for (let k = 0; k < CRYSTAL_STRIDE; k++) {
              crystalBuffer[o + k] = crystalBuffer[lastO + k];
            }
            crystalCount--;
            i--;
            continue;
          }

          const alpha = crystalBuffer[o + 5] * crystalBuffer[o + 6];
          const sz = crystalBuffer[o + 4];

          ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(crystalBuffer[o], crystalBuffer[o + 1], sz * 0.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = `rgba(56, 189, 248, ${(alpha * 0.5).toFixed(2)})`;
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(crystalBuffer[o] - sz * 2, crystalBuffer[o + 1]);
          ctx.lineTo(crystalBuffer[o] + sz * 2, crystalBuffer[o + 1]);
          ctx.moveTo(crystalBuffer[o], crystalBuffer[o + 1] - sz * 2);
          ctx.lineTo(crystalBuffer[o], crystalBuffer[o + 1] + sz * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Tesla Lightning Arcs
      if (lightningActive && lightningEnergy > 0.01) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        lightningEnergy = Math.max(0, lightningEnergy - dt * 1.15);

        lightningChains.forEach((pts) => {
          if (pts.length < 2) return;

          // Outer Glow
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let p = 1; p < pts.length; p++) {
            const jx = (Math.random() - 0.5) * 3;
            const jy = (Math.random() - 0.5) * 3;
            ctx.lineTo(pts[p].x + jx, pts[p].y + jy);
          }
          ctx.strokeStyle = `rgba(56, 189, 248, ${(lightningEnergy * 0.45).toFixed(3)})`;
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 14;
          ctx.stroke();

          // High Voltage White Filament
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let p = 1; p < pts.length; p++) {
            ctx.lineTo(pts[p].x, pts[p].y);
          }
          ctx.strokeStyle = `rgba(255, 255, 255, ${(lightningEnergy * 0.95).toFixed(3)})`;
          ctx.lineWidth = 1.2;
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.stroke();
        });

        ctx.restore();
      } else {
        lightningActive = false;
      }

      updateClocks(now);
      requestAnimationFrame(render);
    }

    window.addEventListener('resize', resize, { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) lastTime = performance.now();
    });

    resize();
    loadSavedApps();
    requestAnimationFrame(render);
  </script>
</body>
</html>
