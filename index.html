<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Focus Engine - Supreme Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;900&family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #010103;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-display: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-display);
      position: relative;
      cursor: crosshair;
    }

    /* Ambient Scanline & Grain Texture (Hardware Accelerated) */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 6;
      opacity: 0.45;
    }

    /* Architectural Viewport Frame */
    .frame-border {
      position: fixed;
      inset: 20px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 10;
    }

    .corner-tick {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(255, 255, 255, 0.6);
    }
    .top-left { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .top-right { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .bottom-left { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .bottom-right { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Luxury Volumetric Beam */
    .spotlight {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        650px circle at var(--x, 50%) var(--y, 50%),
        rgba(255, 255, 255, 0.08),
        transparent 65%
      );
      z-index: 1;
      mix-blend-mode: screen;
      transition: background 0.15s ease-out;
    }

    /* Interactive Cursor Reticle Halo */
    .cursor-halo {
      position: fixed;
      top: 0;
      left: 0;
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 8;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.2s ease,
                  transform 0.04s linear;
    }

    body:active .cursor-halo {
      width: 90px;
      height: 90px;
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Luxury HUD Interface */
    .hud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      padding: 55px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
    }

    .mindset-block {
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.35;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }

    .mindset-block .bold {
      display: block;
      font-weight: 900;
      font-size: 1.85rem;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .sanskrit-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.25rem;
      letter-spacing: 8px;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 200;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      padding: 7px 22px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(14px);
      border-radius: 40px;
    }

    .top-right-metrics {
      display: flex;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
    }

    .metric-chip {
      padding: 6px 14px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      border-radius: 4px;
    }

    .metric-chip span {
      color: #ffffff;
      font-weight: 800;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .system-status {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      line-height: 2;
    }

    .pulse-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 10px #00ff88;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .system-status .live-counter {
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .dont-quit {
      text-align: right;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.12);
      line-height: 1.15;
    }

    .dont-quit span.highlight {
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
    }

    @media (max-width: 900px) {
      .hud-layer { padding: 35px; }
      .sanskrit-title, .top-right-metrics { display: none; }
      .frame-border { inset: 12px; }
    }
  </style>
</head>
<body>

  <div class="frame-border">
    <div class="corner-tick top-left"></div>
    <div class="corner-tick top-right"></div>
    <div class="corner-tick bottom-left"></div>
    <div class="corner-tick bottom-right"></div>
  </div>

  <div class="scanlines"></div>
  <div class="cursor-halo" id="cursorHalo"></div>
  <div class="spotlight" id="spotlight"></div>
  <canvas id="stage"></canvas>

  <div class="hud-layer">
    <div class="top-row">
      <div class="mindset-block">
        MINDSET<br>
        <span class="bold">IS</span>
        EVERYTHING
      </div>

      <div class="sanskrit-title">
        सर्वं सम्भाव्यते त्वयि ।
      </div>

      <div class="top-right-metrics">
        <div class="metric-chip">NODES <span id="nodeCounter">0</span></div>
        <div class="metric-chip">RESONANCE <span id="resonanceCounter">528Hz</span></div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="system-status">
        <span class="pulse-dot"></span>HYPER-FOCUS COGNITIVE STATE<br>
        [SYNAPSE LOCK] <span id="sessionTimer" class="live-counter">00:00:00.0</span>
      </div>

      <div class="dont-quit">
        <span class="highlight">DO</span>N'T<br>
        QU<span class="highlight">IT!</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const spotlight = document.getElementById('spotlight');
    const cursorHalo = document.getElementById('cursorHalo');
    const timerElem = document.getElementById('sessionTimer');
    const nodeElem = document.getElementById('nodeCounter');
    const resonanceElem = document.getElementById('resonanceCounter');

    let width, height;
    let particles = [];
    let stars = [];
    let shockwaves = [];
    const mouse = { x: -1000, y: -1000, radius: 170, isDown: false, prevX: 0, prevY: 0, speed: 0 };

    // 1. Loss-Aversion Session Watch
    const sessionStart = performance.now();
    function updateTimer() {
      const elapsed = performance.now() - sessionStart;
      const ms = Math.floor((elapsed % 1000) / 100);
      const s = Math.floor((elapsed / 1000) % 60);
      const m = Math.floor((elapsed / (1000 * 60)) % 60);
      const h = Math.floor(elapsed / (1000 * 60 * 60));
      timerElem.textContent = 
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
      requestAnimationFrame(updateTimer);
    }
    requestAnimationFrame(updateTimer);

    // 2. Procedural Lux Ambient Audio (528Hz Solfeggio Focus Harmony)
    let audioCtx = null;
    function initAtmosphericAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Base Drone: 528 Hz (Transformative Clarity)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(132, audioCtx.currentTime); // Sub octave
        gain1.gain.setValueAtTime(0.018, audioCtx.currentTime);

        // Warm 5th Overtone
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(198, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.012, audioCtx.currentTime);

        osc1.connect(gain1);
        osc2.connect(gain2);
        gain1.connect(audioCtx.destination);
        gain2.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
      } catch(e) {}
    }

    // 3. Shockwave Wavelet Class
    class Shockwave {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.maxRadius = Math.max(width, height) * 0.45;
        this.speed = 12;
        this.alpha = 0.5;
      }
      update() {
        this.radius += this.speed;
        this.alpha *= 0.94;
      }
      draw() {
        ctx.save();
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 4. Subtle Twinkling Starfield
    class Star {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() < 0.93 ? Math.random() * 1.1 + 0.3 : Math.random() * 2.2 + 1.2;
        this.alpha = Math.random() * 0.6 + 0.1;
        this.twinkleSpeed = (Math.random() * 0.015 + 0.005);
      }
      update() {
        this.alpha += this.twinkleSpeed;
        if (this.alpha > 0.8 || this.alpha < 0.08) {
          this.twinkleSpeed = -this.twinkleSpeed;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.alpha)})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    // 5. Chromatic-Dispersive Vector Particles
    class TextParticle {
      constructor(targetX, targetY) {
        this.originX = targetX;
        this.originY = targetY;
        this.x = targetX + (Math.random() - 0.5) * 60;
        this.y = targetY + (Math.random() - 0.5) * 60;
        this.vx = 0;
        this.vy = 0;
        this.baseSize = 2.2;
        this.friction = 0.86;
        this.spring = 0.075;
      }

      update() {
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < mouse.radius) {
          if (mouse.isDown) {
            // Gravitational Whirlpool & Singularity
            const pull = (mouse.radius - dist) / mouse.radius;
            const angle = Math.atan2(dy, dx) + Math.PI / 2; // Spiral orbit tangent
            this.vx += (dx / dist) * pull * 14 + Math.cos(angle) * pull * 12;
            this.vy += (dy / dist) * pull * 14 + Math.sin(angle) * pull * 12;
          } else {
            // Explosive Kinetic Blast
            const force = (mouse.radius - dist) / mouse.radius;
            const angle = Math.atan2(dy, dx);
            const push = force * 24 * (1 + mouse.speed * 0.04);
            this.vx -= Math.cos(angle) * push;
            this.vy -= Math.sin(angle) * push;
          }
        }

        // Return to perfect structural grid
        const springDx = this.originX - this.x;
        const springDy = this.originY - this.y;
        this.vx += springDx * this.spring;
        this.vy += springDy * this.spring;

        this.vx *= this.friction;
        this.vy *= this.friction;

        this.x += this.vx;
        this.y += this.vy;
      }

      draw() {
        const velocity = Math.hypot(this.vx, this.vy);
        const distToMouse = Math.hypot(mouse.x - this.x, mouse.y - this.y);

        // Chromatic Dispersion (RGB Split on High Velocity)
        if (velocity > 6) {
          const splitOffset = Math.min(velocity * 0.45, 4.5);
          
          // Red Channel Shift
          ctx.fillStyle = 'rgba(255, 50, 70, 0.7)';
          ctx.fillRect(this.x - splitOffset, this.y, this.baseSize, this.baseSize);
          
          // Cyan Channel Shift
          ctx.fillStyle = 'rgba(40, 220, 255, 0.7)';
          ctx.fillRect(this.x + splitOffset, this.y, this.baseSize, this.baseSize);
        }

        // Core Sharp Luminescent Pixel
        let alpha = 0.65;
        let pSize = this.baseSize;

        if (distToMouse < mouse.radius) {
          alpha = 1.0;
          pSize = this.baseSize * 1.5;
        }

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fillRect(this.x - pSize / 2, this.y - pSize / 2, pSize, pSize);
      }
    }

    function init() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      // Cosmic background density
      stars = [];
      const starDensity = Math.floor((width * height) / 3800);
      for (let i = 0; i < starDensity; i++) {
        stars.push(new Star());
      }

      // Brutalist Rasterization Core
      particles = [];
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const offCtx = offscreen.getContext('2d');

      const baseFont = Math.min(width * 0.11, 140);
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';

      // DO MORE.
      offCtx.font = `900 ${baseFont * 0.5}px "Plus Jakarta Sans", sans-serif`;
      offCtx.letterSpacing = "8px";
      offCtx.fillText("DO MORE.", width / 2, height / 2 - baseFont * 0.42);

      // FOCUS
      offCtx.font = `900 ${baseFont}px "Plus Jakarta Sans", sans-serif`;
      offCtx.letterSpacing = "6px";
      offCtx.fillText("FOCUS", width / 2, height / 2 + baseFont * 0.36);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      const step = 5; // Ultra-crisp grid

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const alphaIndex = (y * width + x) * 4 + 3;
          if (imgData[alphaIndex] > 130) {
            particles.push(new TextParticle(x, y));
          }
        }
      }

      nodeElem.textContent = particles.length;
    }

    // Dynamic Micro-Constellations
    function drawNeuralMesh() {
      ctx.lineWidth = 0.5;
      const connectDist = 20;

      for (let i = 0; i < particles.length; i += 3) {
        const p1 = particles[i];
        const distM = Math.hypot(mouse.x - p1.x, mouse.y - p1.y);

        if (distM < mouse.radius * 1.1) {
          for (let j = i + 1; j < particles.length; j += 5) {
            const p2 = particles[j];
            const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);

            if (d < connectDist) {
              const alpha = (1 - d / connectDist) * 0.35;
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Render Stars
      for (let s of stars) {
        s.update();
        s.draw();
      }

      // 2. Render Expanding Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        shockwaves[i].update();
        shockwaves[i].draw();
        if (shockwaves[i].alpha <= 0.01) shockwaves.splice(i, 1);
      }

      // 3. Connective Mesh
      drawNeuralMesh();

      // 4. Kinetic Particles
      for (let p of particles) {
        p.update();
        p.draw();
      }

      // Mouse Velocity decay
      mouse.speed *= 0.85;

      requestAnimationFrame(animate);
    }

    // Input Mechanics
    window.addEventListener('resize', init);

    window.addEventListener('mousemove', (e) => {
      mouse.speed = Math.hypot(e.clientX - mouse.prevX, e.clientY - mouse.prevY);
      mouse.prevX = mouse.x = e.clientX;
      mouse.prevY = mouse.y = e.clientY;

      spotlight.style.setProperty('--x', `${e.clientX}px`);
      spotlight.style.setProperty('--y', `${e.clientY}px`);
      
      cursorHalo.style.left = `${e.clientX}px`;
      cursorHalo.style.top = `${e.clientY}px`;
    });

    window.addEventListener('mousedown', (e) => {
      mouse.isDown = true;
      initAtmosphericAudio();

      // Spawn Sonar Shockwave
      shockwaves.push(new Shockwave(e.clientX, e.clientY));

      // Disperse with shockwave force
      for (let p of particles) {
        const dx = p.x - e.clientX;
        const dy = p.y - e.clientY;
        const dist = Math.hypot(dx, dy);
        if (dist < 280) {
          const push = (1 - dist / 280) * 45;
          p.vx += (dx / dist) * push;
          p.vy += (dy / dist) * push;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      mouse.isDown = false;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
      mouse.isDown = false;
    });

    init();
    animate();
  </script>
</body>
</html>
