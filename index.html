<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Monolith Core — Chrono Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'Cinzel', serif;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.2);
      --glass-surface: rgba(12, 12, 16, 0.76);
      --gold-accent: #e5c07b;
      --gold-dim: rgba(229, 192, 123, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-main);
      color: #ffffff;
      cursor: crosshair;
      position: relative;
    }

    /* Ambient Warp Background */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle 600px at var(--mx, -500px) var(--my, -500px), rgba(255, 255, 255, 0.04), transparent 80%);
      transition: opacity 0.3s ease;
    }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Architectural Frame Lines */
    .view-frame {
      position: fixed;
      inset: 24px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(255, 255, 255, 0.35);
    }
    .c-tl { top: -1px; left: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .c-tr { top: -1px; right: -1px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .c-br { bottom: -1px; right: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* Precision Swiss HUD */
    .hud {
      position: absolute;
      inset: 0;
      padding: 46px 54px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
    }

    /* Dual Docks Container */
    .docks-cluster {
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .apps-dock {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px 5px 8px;
      background: var(--glass-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      width: fit-content;
      position: relative;
    }

    .apps-dock:hover {
      background: rgba(20, 20, 26, 0.94);
      border-color: var(--border-light);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
    }

    .apps-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .apps-trigger svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.6);
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: transform 0.3s ease, stroke 0.3s ease;
    }

    .apps-dock:hover .apps-trigger svg {
      transform: rotate(90deg);
      stroke: #ffffff;
    }

    .apps-label {
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.25s ease;
    }

    .apps-dock:hover .apps-label {
      color: #ffffff;
    }

    .apps-list {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-10px);
      transition: max-width 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.3s ease,
                  transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apps-dock:hover .apps-list {
      max-width: 750px;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      margin-left: 6px;
    }

    .app-btn {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }

    .app-btn svg, .app-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      transition: transform 0.22s ease;
    }

    .app-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.55);
      transform: translateY(-2px) scale(1.08);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
    }

    .app-btn:active {
      transform: scale(0.92);
    }

    .app-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      background: rgba(12, 12, 14, 0.95);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 400;
    }

    .app-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Secret Shake Triggered Add Button */
    .add-app-btn {
      width: 32px;
      height: 32px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .add-app-btn.visible {
      display: flex;
    }

    .add-app-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
      transform: scale(1.1);
    }

    .add-app-btn:hover svg {
      stroke: #000000;
    }

    .add-app-btn svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Top Right Telemetry */
    .telemetry-time-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .time-digits-minimal {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
    }

    .time-date {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
    }

    .row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .telemetry {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pip {
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
    }

    .axiom {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
    }

    /* Modal for Deploying Custom Node */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .custom-modal {
      width: 440px;
      background: rgba(14, 14, 18, 0.95);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-title {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
    }

    .input-group input, .input-group select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: rgba(255, 255, 255, 0.6);
    }

    .file-upload-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .file-upload-wrap input[type="file"] {
      display: none;
    }

    .btn-upload {
      flex: 1;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-upload:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-action {
      padding: 8px 18px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: rgba(255, 255, 255, 0.5);
    }

    .btn-cancel:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-save {
      background: #ffffff;
      border: 1px solid #ffffff;
      color: #000000;
    }

    .btn-save:hover {
      background: rgba(255, 255, 255, 0.85);
    }

    @media (max-width: 800px) {
      .hud { padding: 32px; }
      .view-frame { inset: 12px; }
      .axiom { display: none; }
    }
  </style>
</head>

            <a href="https://ads.google.com" target="_blank" rel="noopener noreferrer" class="app-btn" data-tooltip="Google Ads">
              <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M3.88 12.87L9.67 2.84c.71-1.23 2.28-1.65 3.51-.94l2.12 1.22c1.23.71 1.65 2.28.94 3.51L10.45 16.66c-.71 1.23-2.28 1.65-3.51.94l-2.12-1.22c-1.23-.71-1.65-2.28-.94-3.51z"/>
                <path fill="#FABB05" d="M20.12 16.88L14.33 6.85c-.71-1.23-2.28-1.65-3.51-.94l-2.12 1.22c-1.23.71-1.65 2.28-.94 3.51l5.79 10.03c.71 1.23 2.28 1.65 3.51.94l2.12-1.22c1.23-.71 1.65-2.28.94-3.51z"/>
                <circle fill="#34A853" cx="5.5" cy="18.5" r="3.5"/>
              </svg>
            </a>
            <a href="https://analytics.google.com" target="_blank" rel="noopener noreferrer" class="app-btn" data-tooltip="Analytics">
              <svg viewBox="0 0 24 24">
                <path fill="#F9AB00" d="M21.5 19.5h-3a1.5 1.5 0 0 1-1.5-1.5v-12a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 23 6v12a1.5 1.5 0 0 1-1.5 1.5z"/>
                <path fill="#E37400" d="M13.5 19.5h-3A1.5 1.5 0 0 1 9 18v-6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 12v6a1.5 1.5 0 0 1-1.5 1.5z"/>
                <circle fill="#E37400" cx="4" cy="17" r="2.5"/>
              </svg>
            </a>
            <a href="https://dashboard.stripe.com" target="_blank" rel="noopener noreferrer" class="app-btn" data-tooltip="Stripe">
              <svg viewBox="0 0 24 24"><path fill="#635BFF" d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C17.652.759 14.85 0 11.802 0 4.887 0 .546 3.633.546 9.878c0 7.747 10.664 6.552 10.664 9.932 0 .979-.89 1.423-2.133 1.423-2.52 0-5.376-1.12-7.228-2.147l-.92 5.568C2.85 25.59 5.892 26.5 8.94 26.5c7.228 0 11.756-3.488 11.756-9.843 0-8.083-10.72-6.704-10.72-9.507z"/></svg>
            </a>
            <a href="https://admin.shopify.com" target="_blank" rel="noopener noreferrer" class="app-btn" data-tooltip="Shopify">
              <svg viewBox="0 0 24 24"><path fill="#95BF47" d="M19.34 6.72c-.11-.3-.39-.48-.68-.45-.29.02-4.08.34-4.08.34s-2.7-2.67-2.98-2.95c-.29-.28-.83-.19-1.04.14l-1.44 2.25-3.02.94c-.38.12-.55.57-.38.93l3.68 12.04 10.37-2.18-2.43-11.06zm-7.79 1.34l1.32-2.07c.8 1.15 1.83 2.19 2.08 2.45l-3.4-.38zm-1.87 2.14l2.79.31-2.16 8.54-1.85-6.05 1.22-.8-.2-.36-.2.36 1.4-2.8z"/></svg>
            </a>
            
            <div class="add-app-btn" id="addAppBtn-biz" data-target="biz" title="Register Custom Business App">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </div>
          </div>
        </div>

      </div>

      <!-- Minimal Ephemeris -->
      <div class="telemetry-time-block">
        <div class="time-digits-minimal" id="timeDigitsMinimal">00:00</div>
        <div class="time-date" id="clockDate">INITIALIZING</div>
      </div>
    </div>

    <div class="row-bottom">
      <div class="telemetry">
        <span class="pip"></span>
        <span>QUANTUM EPHEMERIS</span>
        <span id="sessionTimer" style="color: #ffffff;">00:00:00</span>
      </div>
      <div class="axiom">FOCUS IS A VECTOR</div>
    </div>
  </div>

  <!-- Custom App Registration Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="custom-modal">
      <div class="modal-title">Deploy Custom Node</div>
      
      <div class="input-group">
        <label>App Name / Tooltip</label>
        <input type="text" id="appName" placeholder="e.g., Terminal or Notion" />
      </div>

      <div class="input-group">
        <label>Target URL or Windows Protocol</label>
        <input type="text" id="appUrl" placeholder="e.g., https://notion.so or spotify:" />
      </div>

      <div class="input-group">
        <label>Icon Vector / File</label>
        <div class="file-upload-wrap">
          <input type="file" id="appIconFile" accept=".svg,image/png,image/jpeg,image/webp" />
          <button type="button" class="btn-upload" id="triggerFileUpload">Select File (SVG/PNG)</button>
        </div>
      </div>

      <div class="input-group">
        <label>Target Dock</label>
        <select id="dockTarget">
          <option value="apps">Apps Shelf</option>
          <option value="biz">Business Shelf</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-action btn-cancel" id="btnCancel">Cancel</button>
        <button class="btn-action btn-save" id="btnSave">Deploy</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const ambientGlow = document.getElementById('ambientGlow');
    const timeDigitsMinimal = document.getElementById('timeDigitsMinimal');
    const clockDate = document.getElementById('clockDate');
    const sessionTimer = document.getElementById('sessionTimer');
    
    // Modal Nodes
    const modalBackdrop = document.getElementById('modalBackdrop');
    const addAppBtnApps = document.getElementById('addAppBtn-apps');
    const addAppBtnBiz = document.getElementById('addAppBtn-biz');
    const btnCancel = document.getElementById('btnCancel');
    const btnSave = document.getElementById('btnSave');
    const appNameInput = document.getElementById('appName');
    const appUrlInput = document.getElementById('appUrl');
    const appIconFileInput = document.getElementById('appIconFile');
    const triggerFileUpload = document.getElementById('triggerFileUpload');
    const dockTargetSelect = document.getElementById('dockTarget');

    let customIconDataUrl = '';
    let width = 0;
    let height = 0;

    // -------------------------------------------------------------
    // QUANTUM FIBONACCI 3D CHRONO SPHERE LATTICE
    // -------------------------------------------------------------
    const SPHERE_COUNT = 380;
    const SPHERE_STRIDE = 7; // [ux, uy, uz, digitNoise, phase, speed, focalType]
    const sphereBuffer = new Float32Array(SPHERE_COUNT * SPHERE_STRIDE);
    const goldenRatio = (1 + Math.sqrt(5)) / 2;

    for (let i = 0; i < SPHERE_COUNT; i++) {
      const o = i * SPHERE_STRIDE;
      const theta = 2 * Math.PI * i / goldenRatio;
      const phi = Math.acos(1 - 2 * (i + 0.5) / SPHERE_COUNT);

      sphereBuffer[o] = Math.cos(theta) * Math.sin(phi);
      sphereBuffer[o + 1] = Math.sin(theta) * Math.sin(phi);
      sphereBuffer[o + 2] = Math.cos(phi);
      sphereBuffer[o + 3] = Math.floor(Math.random() * 10);
      sphereBuffer[o + 4] = Math.random() * Math.PI * 2;
      sphereBuffer[o + 5] = Math.random() * 0.035 + 0.015;
      sphereBuffer[o + 6] = Math.random() < 0.25 ? 1 : 0;
    }

    // Shrinking Trail Buffer
    const TRAIL_MAX = 22;
    const trail = new Float32Array(TRAIL_MAX * 3);
    let trailHead = 0;

    // Background Dust Simulation
    const STAR_COUNT = 60;
    const starBuffer = new Float32Array(STAR_COUNT * 4); // [x, y, speed, alpha]
    for (let i = 0; i < STAR_COUNT; i++) {
      starBuffer[i * 4] = Math.random();
      starBuffer[i * 4 + 1] = Math.random();
      starBuffer[i * 4 + 2] = Math.random() * 0.0003 + 0.0001;
      starBuffer[i * 4 + 3] = Math.random() * 0.4 + 0.1;
    }

    const mouse = {
      x: -1000,
      y: -1000,
      prevX: -1000,
      prevY: -1000,
      rotX: 0,
      rotY: 0,
      hasMoved: false
    };

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const startTime = performance.now();

    // -------------------------------------------------------------
    // LOCAL STORAGE CUSTOM NODES MANAGEMENT
    // -------------------------------------------------------------
    function loadSavedApps() {
      try {
        const saved = JSON.parse(localStorage.getItem('aethelgard_nodes_v2') || '[]');
        saved.forEach(app => renderCustomApp(app));
      } catch(e) {}
    }

    function renderCustomApp(app) {
      const isBiz = app.dock === 'biz';
      const targetList = isBiz 
        ? document.getElementById('listBiz')
        : document.getElementById('listApps');
      const addBtn = isBiz ? addAppBtnBiz : addAppBtnApps;

      const a = document.createElement('a');
      a.href = app.url;
      a.className = 'app-btn';
      a.dataset.tooltip = app.name;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      if (app.icon && (app.icon.startsWith('data:image') || app.icon.startsWith('http'))) {
        const img = document.createElement('img');
        img.src = app.icon;
        a.appendChild(img);
      } else {
        a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`;
      }

      targetList.insertBefore(a, addBtn);
    }

    function saveCustomApp(app) {
      try {
        const saved = JSON.parse(localStorage.getItem('aethelgard_nodes_v2') || '[]');
        saved.push(app);
        localStorage.setItem('aethelgard_nodes_v2', JSON.stringify(saved));
        renderCustomApp(app);
      } catch(e) {}
    }

    // Modal Interaction
    triggerFileUpload.addEventListener('click', () => appIconFileInput.click());
    appIconFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        triggerFileUpload.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (ev) => {
          customIconDataUrl = ev.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function openModalForDock(target) {
      dockTargetSelect.value = target;
      modalBackdrop.classList.add('open');
      appNameInput.focus();
    }

    addAppBtnApps.addEventListener('click', () => openModalForDock('apps'));
    addAppBtnBiz.addEventListener('click', () => openModalForDock('biz'));

    btnCancel.addEventListener('click', () => {
      modalBackdrop.classList.remove('open');
      customIconDataUrl = '';
      appNameInput.value = '';
      appUrlInput.value = '';
      triggerFileUpload.textContent = 'Select File (SVG/PNG)';
    });

    btnSave.addEventListener('click', () => {
      const name = appNameInput.value.trim();
      const url = appUrlInput.value.trim();
      if (!name || !url) return;

      saveCustomApp({
        name,
        url,
        icon: customIconDataUrl,
        dock: dockTargetSelect.value
      });

      btnCancel.click();
    });

    // -------------------------------------------------------------
    // SHAKE DETECTION FOR BOTH APPS AND BUSINESS DOCKS
    // -------------------------------------------------------------
    function setupDockShakeDetection(dockEl, addBtnEl) {
      let shakeCount = 0;
      let lastDir = 0;
      let lastTime = 0;

      dockEl.addEventListener('mousemove', (e) => {
        const dx = e.movementX;
        const now = performance.now();

        if (Math.abs(dx) > 10) {
          const dir = Math.sign(dx);
          if (dir !== lastDir && (now - lastTime) < 320) {
            shakeCount++;
            if (shakeCount >= 4) {
              addBtnEl.classList.add('visible');
            }
          }
          lastDir = dir;
          lastTime = now;
        }
      });
    }

    setupDockShakeDetection(document.getElementById('dockApps'), addAppBtnApps);
    setupDockShakeDetection(document.getElementById('dockBiz'), addAppBtnBiz);

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    function addTrailPoint(x, y) {
      const o = trailHead * 3;
      trail[o] = x;
      trail[o + 1] = y;
      trail[o + 2] = 1.0;
      trailHead = (trailHead + 1) % TRAIL_MAX;
    }

    let rotY = 0;
    let rotX = 0;

    function render(now) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // System Clocks
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');
      const ms = d.getMilliseconds();
      
      timeDigitsMinimal.textContent = `${h}:${m}`;
      clockDate.textContent = `${days[d.getDay()]} / ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;

      const secElapsed = Math.floor((now - startTime) / 1000);
      const sh = String(Math.floor(secElapsed / 3600)).padStart(2, '0');
      const sm = String(Math.floor((secElapsed % 3600) / 60)).padStart(2, '0');
      const ss = String(secElapsed % 60).padStart(2, '0');
      sessionTimer.textContent = `${sh}:${sm}:${ss}`;

      // 1. Render Background Dust Particles
      for (let i = 0; i < STAR_COUNT; i++) {
        const o = i * 4;
        starBuffer[o + 1] -= starBuffer[o + 2];
        if (starBuffer[o + 1] < 0) starBuffer[o + 1] = 1;

        ctx.fillStyle = `rgba(255, 255, 255, ${starBuffer[o + 3]})`;
        ctx.fillRect(starBuffer[o] * width, starBuffer[o + 1] * height, 1.2, 1.2);
      }

      // -------------------------------------------------------------
      // 3D CHRONO SPHERE GEOMETRIC MATRIX
      // -------------------------------------------------------------
      const cx = width / 2;
      const cy = height / 2;
      const sphereRadius = Math.min(width, height) * 0.285;

      rotY += 0.0035;
      rotX += 0.0018;

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < SPHERE_COUNT; i++) {
        const o = i * SPHERE_STRIDE;
        const x = sphereBuffer[o];
        const y = sphereBuffer[o + 1];
        const z = sphereBuffer[o + 2];

        // 3D Rotation Transformations
        const x1 = x * cosY - z * sinY;
        const z1 = z * cosY + x * sinY;
        const y2 = y * cosX - z1 * sinX;
        const z2 = z1 * cosX + y * sinX;

        // Perspective
        const fov = 2.4;
        const scale = fov / (fov + z2);
        const projX = cx + x1 * sphereRadius * scale;
        const projY = cy + y2 * sphereRadius * scale;

        const depthAlpha = Math.max((z2 + 1) / 2, 0.06);
        sphereBuffer[o + 4] += sphereBuffer[o + 5];
        const twinkle = Math.sin(sphereBuffer[o + 4]) * 0.3 + 0.7;
        const finalAlpha = depthAlpha * twinkle;

        // Number assignment
        let displayChar;
        if (i % 6 === 0) displayChar = s[0];
        else if (i % 6 === 1) displayChar = s[1];
        else if (i % 6 === 2) displayChar = m[0];
        else if (i % 6 === 3) displayChar = m[1];
        else displayChar = sphereBuffer[o + 3];

        const fontSize = Math.max(Math.floor(13 * scale), 7);
        ctx.font = `${fontSize}px "JetBrains Mono", monospace`;
        ctx.fillStyle = `rgba(255, 255, 255, ${finalAlpha.toFixed(2)})`;
        ctx.fillText(displayChar, projX, projY);
      }
      ctx.restore();

      // -------------------------------------------------------------
      // CENTER ATTENTION CORE: SANSKRIT VECTOR + CHRONOMETER
      // -------------------------------------------------------------
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 1. Orbital Chrono Ring (Real Seconds Gauge)
      const secProgress = (d.getSeconds() + ms / 1000) / 60;
      ctx.beginPath();
      ctx.arc(cx, cy, sphereRadius * 0.54, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * secProgress);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // Outer Ticked Micro Boundary
      ctx.beginPath();
      ctx.arc(cx, cy, sphereRadius * 0.58, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 2. Centerpiece Top: Sanskrit High Consciousness Vector
      ctx.font = '600 clamp(0.75rem, 1.4vw, 1.05rem) "Cinzel", serif';
      ctx.fillStyle = 'rgba(229, 192, 123, 0.9)'; // Subtle Champagne Gold
      ctx.shadowColor = 'rgba(229, 192, 123, 0.5)';
      ctx.shadowBlur = 14;
      ctx.fillText('सर्वं सम्भाव्यते त्वयि', cx, cy - 42);

      // 3. Centerpiece Core: High Density Digits
      ctx.font = '800 clamp(2.6rem, 5.8vw, 4.4rem) "JetBrains Mono", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
      ctx.shadowBlur = 22;
      ctx.fillText(`${h}:${m}:${s}`, cx, cy + 2);

      // 4. Centerpiece Bottom: Precision Chrono Sub-telemetry
      ctx.font = '500 0.68rem "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
      ctx.shadowBlur = 0;
      ctx.letterSpacing = "4px";
      ctx.fillText(`UTC+05:30 • SEC ${(ms).toString().padStart(3, '0')}`, cx, cy + 44);
      ctx.restore();

      // -------------------------------------------------------------
      // MAGICAL SHRINKING LINE RIBBON TRAIL
      // -------------------------------------------------------------
      if (mouse.hasMoved) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (let i = 0; i < TRAIL_MAX - 1; i++) {
          const idxA = ((trailHead - i - 1 + TRAIL_MAX) % TRAIL_MAX) * 3;
          const idxB = ((trailHead - i - 2 + TRAIL_MAX) % TRAIL_MAX) * 3;

          const lifeA = trail[idxA + 2];
          const lifeB = trail[idxB + 2];

          if (lifeA > 0.05 && lifeB > 0.05) {
            const progress = 1 - (i / TRAIL_MAX);
            const lineWidth = Math.max(progress * 3.4, 0.4);
            const alpha = Math.min(lifeA * progress * 0.85, 0.9);

            ctx.beginPath();
            ctx.moveTo(trail[idxA], trail[idxA + 1]);
            ctx.lineTo(trail[idxB], trail[idxB + 1]);

            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          }
          trail[idxA + 2] *= 0.88;
        }
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    // Hardware Event Handlers
    window.addEventListener('resize', resize, { passive: true });

    window.addEventListener('mousemove', (e) => {
      mouse.hasMoved = true;
      mouse.x = e.clientX;
      mouse.y = e.clientY;

      ambientGlow.style.setProperty('--mx', `${e.clientX}px`);
      ambientGlow.style.setProperty('--my', `${e.clientY}px`);

      // Gentle interactive 3D rotation bias
      rotY += (e.clientX - mouse.prevX) * 0.00045;
      rotX += (e.clientY - mouse.prevY) * 0.00045;

      mouse.prevX = e.clientX;
      mouse.prevY = e.clientY;

      addTrailPoint(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('mouseleave', () => {
      mouse.hasMoved = false;
      ambientGlow.style.setProperty('--mx', `-500px`);
      ambientGlow.style.setProperty('--my', `-500px`);
    });

    resize();
    loadSavedApps();
    requestAnimationFrame(render);
  </script>
</body>
