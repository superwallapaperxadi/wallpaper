<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Monolith Core — Precision Quantum Chrono</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <!-- Ethers v5 for Multi-Chain Crypto Wallet Interrogation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.22);
      --glass-surface: rgba(14, 14, 18, 0.75);
      --glass-surface-dense: rgba(18, 18, 24, 0.94);
      --accent-sky: #38bdf8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-main);
      color: #ffffff;
      cursor: crosshair;
      position: relative;
    }

    /* Ambient Cursor Spotlight */
    .ambient-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle 550px at var(--mx, -500px) var(--my, -500px), rgba(255, 255, 255, 0.04), transparent 75%);
    }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Architectural Frame Lines */
    .view-frame {
      position: fixed;
      top: 22px;
      left: 22px;
      right: 22px;
      bottom: 64px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(255, 255, 255, 0.45);
    }
    .c-tl { top: -1px; left: -1px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .c-tr { top: -1px; right: -1px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .c-br { bottom: -1px; right: -1px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* HUD Layout */
    .hud {
      position: absolute;
      inset: 0;
      padding: 42px 52px 84px 52px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
    }

    .left-cluster {
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
      max-width: calc(100vw - 360px);
      z-index: 20;
    }

    .docks-cluster {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .apps-dock {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px 4px 8px;
      background: var(--glass-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      width: fit-content;
      max-width: 100%;
    }

    .apps-dock:hover {
      background: var(--glass-surface-dense);
      border-color: var(--border-light);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7);
    }

    .apps-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .apps-trigger svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.6);
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: transform 0.3s ease, stroke 0.3s ease;
    }

    .apps-dock:hover .apps-trigger svg {
      transform: rotate(90deg);
      stroke: #ffffff;
    }

    .apps-label {
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.25s ease;
    }

    .apps-dock:hover .apps-label {
      color: #ffffff;
    }

    .apps-list {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-8px);
      transition: max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease,
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .apps-dock:hover .apps-list {
      max-width: 720px;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      margin-left: 6px;
    }

    .app-btn {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }

    .app-btn svg, .app-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .app-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px) scale(1.08);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .app-btn:active {
      transform: scale(0.92);
    }

    .app-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #ffffff;
      background: rgba(12, 12, 16, 0.95);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 400;
    }

    .app-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #listBiz .app-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      padding: 0;
    }

    #listBiz .app-btn img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .add-app-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.22s ease;
      flex-shrink: 0;
    }

    .add-app-btn:hover {
      background: #ffffff;
      border-color: #ffffff;
      transform: scale(1.1);
    }

    .add-app-btn:hover svg {
      stroke: #000000;
    }

    .add-app-btn svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }

    /* ============================================================
       CLEAN MODERN PILL SEARCH BAR
       ============================================================ */
    .search-cluster {
      display: flex;
      align-items: center;
      position: relative;
      width: fit-content;
      margin-top: 2px;
    }

    .search-capsule {
      display: flex;
      align-items: center;
      width: 270px;
      height: 38px;
      background: var(--glass-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 3px 4px 3px 18px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-capsule:focus-within,
    .search-capsule:hover {
      width: 340px;
      background: var(--glass-surface-dense);
      border-color: var(--border-light);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      padding: 0;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 300;
    }

    .search-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.22s ease;
      outline: none;
    }

    .search-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: scale(1.06);
    }

    .search-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ============================================================
       TOP RIGHT COMPACT EPHEMERIS DATE BLOCK
       ============================================================ */
    .telemetry-time-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: auto;
      z-index: 20;
      margin-right: 210px;
      margin-top: 4px;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .time-date {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(14, 14, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .intertwined-star-indicator {
      width: 15px;
      height: 15px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      animation: starIntertwinedSpin 7s linear infinite;
      filter: none !important;
      opacity: 1 !important;
      box-shadow: none !important;
    }

    .pip-star {
      width: 14px;
      height: 14px;
      margin-right: 3px;
    }

    @keyframes starIntertwinedSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ============================================================
       CENTER FOCUS CORE: CRYSTAL-CLEAR 8K "DO MORE FOCUS"
       ============================================================ */
    .center-focus-bay {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: auto;
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: default;
      width: 90%;
      max-width: 960px;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .focus-line-wrap {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    /* LINE 2 STYLING (Soft Edge Gradient) */
    .line-2 {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #ffffff 50%, transparent 100%);
      opacity: 0.35;
      cursor: pointer;
      transition: opacity 0.3s ease, filter 0.3s ease, transform 0.3s ease;
    }

    /* HOVER EFFECT */
    .line-2:hover,
    .center-focus-bay:hover .line-2 {
      opacity: 1;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
      transform: scaleY(1.5);
    }

    .focus-display-frame {
      position: relative;
      padding: 6px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      overflow: visible;
    }

    .focus-text-primary {
      font-family: var(--font-main);
      font-size: clamp(3.0rem, 7.2vw, 6.2rem);
      font-weight: 900;
      letter-spacing: clamp(6px, 1.8vw, 18px);
      text-transform: uppercase;
      line-height: 0.95;
      text-indent: clamp(6px, 1.8vw, 18px);
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 25%, #94a3b8 48%, #ffffff 52%, #cbd5e1 75%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: none;
      -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.2);
      animation: metallicShimmer 3.2s linear infinite;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .center-focus-bay:hover .focus-text-primary {
      transform: scale(1.025);
    }

    /* ============================================================
       LUXURY CYBERNETIC PRECISION ENGINE (3-Sec Mouse Stationary Swarm)
       ============================================================ */
    .ambient-blob {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .ambient-blob.active {
      opacity: 1;
    }

    #blob1 {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(3, 3, 5, 0) 70%);
      top: -10%;
      left: -10%;
    }

    #blob2 {
      background: radial-gradient(circle, rgba(140, 180, 255, 0.04) 0%, rgba(3, 3, 5, 0) 70%);
      bottom: -10%;
      right: -10%;
    }

    .cybernetic-mouse-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cybernetic-mouse-canvas.active {
      opacity: 1;
    }

    /* ============================================================
       RADIAL CLICK APP LAUNCHER (Satellite Blooming Cluster)
       ============================================================ */
    .radial-launcher {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 10005;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
    }

    .radial-launcher.active {
      pointer-events: auto;
      visibility: visible;
      opacity: 1;
    }

    /* Satellite Orbit Container for Continuous Smooth Rotation */
    .radial-satellites-orbit {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .radial-launcher.active .radial-satellites-orbit {
      pointer-events: auto;
      animation: orbitRevolution 24s linear infinite;
    }

    /* Pause orbit rotation smoothly on hover so user can easily click any icon */
    .radial-launcher.active .radial-satellites-orbit:hover,
    .radial-launcher.active .radial-satellites-orbit:hover .radial-item {
      animation-play-state: paused;
    }

    @keyframes orbitRevolution {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes itemCounterRevolution {
      from { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(0deg); }
      to { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(-360deg); }
    }

    .radial-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.22s ease,
                  background 0.2s,
                  fill 0.2s;
      z-index: 8;
    }

    .radial-item svg {
      width: 19px;
      height: 19px;
      transition: fill 0.2s ease, transform 0.2s ease;
    }

    /* 8 Radial Satellite Offsets (~76px radius) */
    .radial-launcher.active .r-item-1 { --tx: 0px; --ty: -76px; fill: #03a9f4; }
    .radial-launcher.active .r-item-2 { --tx: 54px; --ty: -54px; fill: #0462df; }
    .radial-launcher.active .r-item-3 { --tx: 76px; --ty: 0px; fill: #1db954; }
    .radial-launcher.active .r-item-4 { --tx: 54px; --ty: 54px; fill: #8c9eff; }
    .radial-launcher.active .r-item-5 { --tx: 0px; --ty: 76px; fill: #bd081c; }
    .radial-launcher.active .r-item-6 { --tx: -54px; --ty: 54px; fill: #0088cc; }
    .radial-launcher.active .r-item-7 { --tx: -76px; --ty: 0px; fill: #000000; }
    .radial-launcher.active .r-item-8 { --tx: -54px; --ty: -54px; fill: #ff4500; }

    .radial-launcher.active .radial-item {
      opacity: 1;
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1);
      animation: itemCounterRevolution 24s linear infinite;
    }

    /* Hover Colors matching User Spec */
    .r-item-1:hover { background: #03a9f4 !important; }
    .r-item-1:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-2:hover { background: #0462df !important; }
    .r-item-2:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-3:hover { background: #1db954 !important; }
    .r-item-3:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-4:hover { background: #8c9eff !important; }
    .r-item-4:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-5:hover { background: #bd081c !important; }
    .r-item-5:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-6:hover { background: #0088cc !important; }
    .r-item-6:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-7:hover { background: #000000 !important; }
    .r-item-7:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .r-item-8:hover { background: #ff4500 !important; }
    .r-item-8:hover svg { fill: #ffffff !important; transform: scale(1.12); }

    .radial-item::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      font-family: var(--font-mono);
      font-size: 0.58rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(14, 14, 18, 0.95);
      border: 1px solid var(--border-subtle);
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 20;
    }

    .radial-item:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* ============================================================
       BOTTOM ROW: Telemetry, Widgets & Minimal Axiom
       ============================================================ */
    .row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
    }

    .telemetry {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .pip {
      width: 6px;
      height: 6px;
      background: var(--accent-sky);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-sky);
      animation: pipGlow 2s infinite ease-in-out;
    }

    @keyframes pipGlow {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .telemetry-val {
      color: #ffffff;
      font-weight: 700;
    }

    .widget-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 1px;
    }

    .widget-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .widget-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* Notepad Box Button */
    .box {
      height: auto;
      width: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      line-height: 28px;
      height: 28px;
      text-align: center;
      width: 96px;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.3s;
      position: relative;
    }

    .btn button {

      position: absolute;
      inset: 0;
      color: #ffffff;
      font-size: 0.62rem;
      font-family: var(--font-mono);
      letter-spacing: 1.5px;
      font-weight: 600;
      border: none;
      background: transparent;
      cursor: pointer;

    .btn::before, .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      transition: all 0.4s;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
    }

    .btn:hover::before {
      transform: rotate(-12deg);
      background: transparent;
      border-color: rgba(255, 255, 255, 0.5);
    }

    .btn:hover::after {
      transform: rotate(12deg);
      background: transparent;
      border-color: rgba(255, 255, 255, 0.5);
    }

    .hud-toast {

      .hud { padding: 24px; }
      .view-frame { inset: 12px; }
      .bitcoin-inline-cluster { right: 24px; bottom: 70px; }
    }
  </style>
</head>

  <!-- MODAL: ADD CUSTOM NODE -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="custom-modal">

  <script>
    // =============================================================
    // 1. AUDIO SYSTEM (MUTED & DOUBLE-CLICK TOGGLE REMOVED)
    // =============================================================
    let soundEnabled = false;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSmartClick() {
      // Audio completely muted per user request
      return;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
    }

    // =============================================================
    // 2. CANVAS & 3D QUANTUM SPHERE CLOCK MATRIX (EXACT REFERENCE CODE)
    // =============================================================
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const ambientField = document.getElementById('ambientField');
    const clockDate = document.getElementById('clockDate');
    const sessionTimer = document.getElementById('sessionTimer');
    const actualUptime = document.getElementById('actualUptime');

    let width = 0;
    let height = 0;
    const startTime = performance.now();

    // 3D QUANTUM SPHERE CLOCK MATRIX CONFIGURATION
    // 3D QUANTUM SPHERE CLOCK MATRIX CONFIGURATION (OPTIMIZED FOR LOW CPU)
    const SPHERE_COUNT = 180;
    const SPHERE_STRIDE = 7;
    const sphereBuffer = new Float32Array(SPHERE_COUNT * SPHERE_STRIDE);
    const goldenRatio = (1 + Math.sqrt(5)) / 2;

    // Zero-GC Preallocated Projection Buffers for 0-Lag Performance
    const sphereProjX = new Float32Array(SPHERE_COUNT);
    const sphereProjY = new Float32Array(SPHERE_COUNT);
    const sphereScale = new Float32Array(SPHERE_COUNT);
    const sphereAlpha = new Float32Array(SPHERE_COUNT);

    for (let i = 0; i < SPHERE_COUNT; i++) {
      const o = i * SPHERE_STRIDE;
      const theta = 2 * Math.PI * i / goldenRatio;
      const phi = Math.acos(1 - 2 * (i + 0.5) / SPHERE_COUNT);

      sphereBuffer[o] = Math.cos(theta) * Math.sin(phi);
      sphereBuffer[o + 1] = Math.sin(theta) * Math.sin(phi);
      sphereBuffer[o + 2] = Math.cos(phi);
      sphereBuffer[o + 3] = Math.floor(Math.random() * 10);
      sphereBuffer[o + 4] = Math.random() * Math.PI * 2;
      sphereBuffer[o + 5] = Math.random() * 0.04 + 0.01;
      sphereBuffer[o + 6] = Math.random() < 0.2 ? 1 : 0;
    }

    const mouse = {
      x: -1000,
      y: -1000,
      targetX: -1000,
      targetY: -1000,
      prevX: -1000,
      prevY: -1000,
      rotX: 0,
      rotY: 0,
      hasMoved: false
    };

    // =============================================================
    // 2-MINUTE INACTIVITY SCREENSAVER & SYSTEM ACTIVITY TRACKER
    // =============================================================
    let lastActivityTime = performance.now();
    const INACTIVITY_THRESHOLD_MS = 120000; // 2 minutes (120 seconds)

    function recordUserActivity() {
      lastActivityTime = performance.now();
    }

    window.addEventListener('mousemove', recordUserActivity, { passive: true });
    window.addEventListener('mousedown', recordUserActivity, { passive: true });
    window.addEventListener('keydown', recordUserActivity, { passive: true });
    window.addEventListener('touchstart', recordUserActivity, { passive: true });
    window.addEventListener('scroll', recordUserActivity, { passive: true });
    window.addEventListener('wheel', recordUserActivity, { passive: true });

    // Global test overrides & helpers for verification
    window.triggerScreensaver = function(enable) {
      lastActivityTime = enable ? (performance.now() - 150000) : performance.now();
    };
    window.setTestUptime = function(hours) {
      window.__testUptimeSeconds = hours * 3600;
    };
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const qUptime = urlParams.get('uptime');
      if (qUptime) {
        window.__testUptimeSeconds = parseFloat(qUptime) * 3600;
      }
    } catch(e) {}

    let currentClockX = null;
    let currentClockY = null;
    let currentClockRadius = null;

    let rotY = 0;
    let rotX = 0;
    let lastRenderedSec = -1;
    let lastScreensaverState = null;
    let ambientNeedsUpdate = false;

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (typeof resizeCyberneticCanvas === 'function') resizeCyberneticCanvas();
    }

    function render(now) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const d = new Date();
      const currentSec = Math.floor(now / 1000);
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');
      const ms = d.getMilliseconds();

      // Low CPU: Only mutate DOM text strings when the second changes (1 update/sec instead of 60-144/sec)
      if (currentSec !== lastRenderedSec) {
        lastRenderedSec = currentSec;

        if (clockDate) {
          clockDate.textContent = `${days[d.getDay()]} / ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        const secElapsed = Math.floor((now - startTime) / 1000);
        const sh = String(Math.floor(secElapsed / 3600)).padStart(2, '0');
        const sm = String(Math.floor((secElapsed % 3600) / 60)).padStart(2, '0');
        const ss = String(secElapsed % 60).padStart(2, '0');
        if (sessionTimer) sessionTimer.textContent = `${sh}:${sm}:${ss}`;

        // Uptime Telemetry & Threshold Warning Alerts (5h Warning & 24h Critical)
        const uptimeSec = (window.__testUptimeSeconds !== undefined) ? window.__testUptimeSeconds : currentSec;
        const uptimeHours = uptimeSec / 3600;
        const ph = String(Math.floor(uptimeSec / 3600)).padStart(2, '0');
        const pm = String(Math.floor((uptimeSec % 3600) / 60)).padStart(2, '0');
        const ps = String(uptimeSec % 60).padStart(2, '0');

        if (actualUptime) {
          actualUptime.textContent = `${ph}:${pm}:${ps}`;
          const warningBadge = document.getElementById('uptimeWarningBadge');
          if (uptimeHours >= 24) {
            actualUptime.className = 'telemetry-val uptime-alert alert-critical';
            if (warningBadge) {
              warningBadge.textContent = '[ NEED TO OFF PC. NEED REST ]';
              warningBadge.className = 'uptime-alert alert-critical';
              warningBadge.style.display = 'inline-block';
            }
          } else if (uptimeHours >= 5) {
            actualUptime.className = 'telemetry-val uptime-alert alert-warning';
            if (warningBadge) {
              warningBadge.textContent = '[ SECURITY SUGGESTED : SYSTEM RESTART NOW ]';
              warningBadge.className = 'uptime-alert alert-warning';
              warningBadge.style.display = 'inline-block';
            }
          } else {
            actualUptime.className = 'telemetry-val';
            if (warningBadge) {
              warningBadge.style.display = 'none';
            }
          }
        }
      }

      // -------------------------------------------------------------
      // 2-MINUTE INACTIVITY SCREENSAVER CLOCK & FOCUS CORE FADE
      // -------------------------------------------------------------
      const isScreensaver = (now - lastActivityTime) > INACTIVITY_THRESHOLD_MS;
      const focusCenterBay = document.getElementById('focusCenterBay');
      const telemetryTimeBlock = document.querySelector('.telemetry-time-block');

      // Low CPU: Only mutate DOM element styles when screensaver state actually changes
      if (isScreensaver !== lastScreensaverState) {
        lastScreensaverState = isScreensaver;
        if (focusCenterBay) {
          focusCenterBay.style.opacity = isScreensaver ? '0' : '1';
          focusCenterBay.style.pointerEvents = isScreensaver ? 'none' : 'auto';
        }
        if (telemetryTimeBlock) {
          telemetryTimeBlock.style.opacity = isScreensaver ? '0' : '1';
          telemetryTimeBlock.style.pointerEvents = isScreensaver ? 'none' : 'auto';
        }
      }

      let targetRadius, targetCx, targetCy;
      if (isScreensaver) {
        // Enlarge in screen center as high-tech screensaver clock
        targetRadius = Math.max(Math.min(width, height) * 0.22, 175);
        targetCx = width / 2;
        targetCy = height / 2;
      } else {
        // Top right scaled compact core
        targetRadius = Math.max(Math.min(width, height) * 0.09, 65);
        targetCx = width - targetRadius - 64;
        targetCy = targetRadius + 50;
      }

      if (currentClockX === null) {
        currentClockX = targetCx;
        currentClockY = targetCy;
        currentClockRadius = targetRadius;
      } else {
        currentClockX += (targetCx - currentClockX) * 0.045;
        currentClockY += (targetCy - currentClockY) * 0.045;
        currentClockRadius += (targetRadius - currentClockRadius) * 0.045;
      }

      const cx = currentClockX;
      const cy = currentClockY;
      const sphereRadius = currentClockRadius;

      rotY += 0.0035;
      rotX += 0.0018;

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      // Low CPU: Batch particles into 3 size tiers to avoid setting ctx.font 180 times per frame
      const baseCharSize = Math.max(7, Math.floor(sphereRadius * 0.11));
      const fontSmall = `600 ${Math.max(5, Math.floor(baseCharSize * 0.72))}px "JetBrains Mono", monospace`;
      const fontMed = `600 ${Math.max(6, Math.floor(baseCharSize * 0.98))}px "JetBrains Mono", monospace`;
      const fontLarge = `600 ${Math.max(8, Math.floor(baseCharSize * 1.3))}px "JetBrains Mono", monospace`;

      for (let i = 0; i < SPHERE_COUNT; i++) {
        const o = i * SPHERE_STRIDE;
        const x = sphereBuffer[o];
        const y = sphereBuffer[o + 1];
        const z = sphereBuffer[o + 2];

        const x1 = x * cosY - z * sinY;
        const z1 = z * cosY + x * sinY;

        const y2 = y * cosX - z1 * sinX;
        const z2 = z1 * cosX + y * sinX;

        const fov = 2.4;
        const scale = fov / (fov + z2);
        sphereProjX[i] = cx + x1 * sphereRadius * scale;
        sphereProjY[i] = cy + y2 * sphereRadius * scale;
        sphereScale[i] = scale;

        const depthAlpha = Math.max((z2 + 1) * 0.5, 0.06);
        sphereBuffer[o + 4] += sphereBuffer[o + 5];
        const twinkle = Math.sin(sphereBuffer[o + 4]) * 0.3 + 0.7;
        sphereAlpha[i] = depthAlpha * twinkle;
      }

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';

      // Zero-GC Tier Small (< 0.88)
      ctx.font = fontSmall;
      for (let i = 0; i < SPHERE_COUNT; i++) {
        if (sphereScale[i] < 0.88) {
          const ch = (i % 6 === 0) ? s[0] : (i % 6 === 1) ? s[1] : (i % 6 === 2) ? m[0] : (i % 6 === 3) ? m[1] : sphereBuffer[i * SPHERE_STRIDE + 3];
          ctx.globalAlpha = sphereAlpha[i];
          ctx.fillText(ch, sphereProjX[i], sphereProjY[i]);
        }
      }

      // Zero-GC Tier Medium (0.88 to 1.14)
      ctx.font = fontMed;
      for (let i = 0; i < SPHERE_COUNT; i++) {
        const sc = sphereScale[i];
        if (sc >= 0.88 && sc < 1.14) {
          const ch = (i % 6 === 0) ? s[0] : (i % 6 === 1) ? s[1] : (i % 6 === 2) ? m[0] : (i % 6 === 3) ? m[1] : sphereBuffer[i * SPHERE_STRIDE + 3];
          ctx.globalAlpha = sphereAlpha[i];
          ctx.fillText(ch, sphereProjX[i], sphereProjY[i]);
        }
      }

      // Zero-GC Tier Large (>= 1.14)
      ctx.font = fontLarge;
      for (let i = 0; i < SPHERE_COUNT; i++) {
        if (sphereScale[i] >= 1.14) {
          const ch = (i % 6 === 0) ? s[0] : (i % 6 === 1) ? s[1] : (i % 6 === 2) ? m[0] : (i % 6 === 3) ? m[1] : sphereBuffer[i * SPHERE_STRIDE + 3];
          ctx.globalAlpha = sphereAlpha[i];
          ctx.fillText(ch, sphereProjX[i], sphereProjY[i]);
        }
      }

      ctx.restore();
      ctx.globalAlpha = 1.0;

      // Mini Progress Orbit Ring
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const secProgress = (d.getSeconds() + ms / 1000) / 60;
      ctx.beginPath();
      ctx.arc(cx, cy, sphereRadius * 0.62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * secProgress);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = Math.max(1.2, sphereRadius * 0.015);
      ctx.stroke();

      // Dynamic Scaled Digital Time Core (Zero shadowBlur for low CPU usage)
      const timeFontSize = Math.max(18, Math.round(sphereRadius * 0.35));
      ctx.font = `700 ${timeFontSize}px "JetBrains Mono", monospace`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${h}:${m}:${s}`, cx, cy - (sphereRadius * 0.03));

      // Micro Fractions
      const microFontSize = Math.max(8, Math.round(timeFontSize * 0.42));
      ctx.font = `500 ${microFontSize}px "JetBrains Mono", monospace`;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.letterSpacing = `${Math.round(microFontSize * 0.2)}px`;
      ctx.fillText(`.${(ms).toString().padStart(3, '0')}`, cx, cy + (timeFontSize * 0.65));

      // Screensaver Mode Integrated Date
      if (sphereRadius > 115) {
        const dateFontSize = Math.max(9, Math.round(timeFontSize * 0.26));
        ctx.font = `600 ${dateFontSize}px "JetBrains Mono", monospace`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.letterSpacing = '2px';
        ctx.fillText(`${days[d.getDay()]} / ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`, cx, cy + (sphereRadius * 0.44));
      }
      ctx.restore();

      // Debounced ambient light field update
      if (ambientNeedsUpdate) {
        ambientNeedsUpdate = false;
        ambientField.style.setProperty('--mx', `${mouse.targetX}px`);
        ambientField.style.setProperty('--my', `${mouse.targetY}px`);
      }

      if (typeof animateCyberneticEngine === 'function') animateCyberneticEngine(now);

      requestAnimationFrame(render);
    }

    window.addEventListener('resize', resize, { passive: true });

    window.addEventListener('mousemove', (e) => {
      recordUserActivity();
      mouse.hasMoved = true;
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
      ambientNeedsUpdate = true;
      if (mouse.prevX === -1000) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.prevX = e.clientX;
        mouse.prevY = e.clientY;
      }

      // Watch moves with mouse hover & drag
      rotY += (e.clientX - mouse.prevX) * 0.0005;
      rotX += (e.clientY - mouse.prevY) * 0.0005;

      mouse.prevX = e.clientX;
      mouse.prevY = e.clientY;
    }, { passive: true });

    window.addEventListener('mouseleave', () => {
      mouse.hasMoved = false;
      mouse.prevX = -1000;
      mouse.prevY = -1000;
      ambientField.style.setProperty('--mx', `-500px`);
      ambientField.style.setProperty('--my', `-500px`);
    });

    // =============================================================
    // 3. IN-BUILT HUD WEBVIEW2 APP LAUNCH CONTROLLER (OPENS IN WV2)
    // =============================================================
    function launchInBuiltApp(e, url, title) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (!url || url === '#') return;
      playSmartClick();

      // Open strictly inside the in-HUD WebView2 browser container (#hudBrowser)
      hudOmniUrl.value = url;
      browserFrame.src = url;
      hudBrowser.classList.remove('minimized');
      hudBrowser.classList.add('active');
      minimizedRestoreBtn.classList.remove('active');
      if (minimizedQueryTag) {
        minimizedQueryTag.textContent = title || (url.includes('telegram') ? 'Telegram' : (url.includes('x.com') ? 'Twitter' : 'WV2'));
      }
      showToast('WV2 ACTIVE: ' + (title || 'APP'));
    }

    document.querySelectorAll('.app-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const url = btn.getAttribute('href');
        const title = btn.getAttribute('data-tooltip') || 'App';
        if (url && url !== '#') {
          launchInBuiltApp(e, url, title);
        }
      });
    });

    // =============================================================
    // 3.1. RADIAL CLICK APP LAUNCHER CONTROLLER (OPENS ON EMPTY CANVAS CLICK)
    // =============================================================
    const radialLauncher = document.getElementById('radialLauncher');
    let radialAutoCloseTimer = null;

    function startRadialAutoClose() {
      if (radialAutoCloseTimer) clearTimeout(radialAutoCloseTimer);
      radialAutoCloseTimer = setTimeout(() => {
        closeRadialLauncher();
      }, 2000); // Auto-closes in 2s as requested by user
    }

    function openRadialLauncher(x, y) {
      if (!radialLauncher) return;
      const pad = 90;
      const clampedX = Math.max(pad, Math.min(window.innerWidth - pad, x));
      const clampedY = Math.max(pad, Math.min(window.innerHeight - pad, y));

      radialLauncher.style.left = `${clampedX}px`;
      radialLauncher.style.top = `${clampedY}px`;
      radialLauncher.classList.add('active');
      playSmartClick();
      startRadialAutoClose();
    }

    function closeRadialLauncher() {
      if (!radialLauncher) return;
      if (radialAutoCloseTimer) {
        clearTimeout(radialAutoCloseTimer);
        radialAutoCloseTimer = null;
      }
      if (radialLauncher.classList.contains('active')) {
        radialLauncher.classList.remove('active');
        playSmartClick();
      }
    }

    // Pause auto-close on hover, resume on leave
    if (radialLauncher) {
      radialLauncher.addEventListener('mouseenter', () => {
        if (radialAutoCloseTimer) clearTimeout(radialAutoCloseTimer);
      });
      radialLauncher.addEventListener('mouseleave', () => {
        if (radialLauncher.classList.contains('active')) {
          startRadialAutoClose();
        }
      });
    }

    // Clicking anywhere on empty canvas/screen opens radial launcher
    window.addEventListener('click', (e) => {
      // Do not trigger if clicked inside existing controls, modals, docks, browser, etc.
      if (e.target.closest('input, textarea, select, button, a, form, .apps-dock, .custom-modal, .notes-modal-backdrop, .hud-browser-window, .bitcoin-inline-cluster, .radial-launcher, .widget-btn, .box, #cryptoModal, #notesModalBackdrop, .center-focus-bay, #focusCenterBay')) {
        return;
      }

      if (radialLauncher && radialLauncher.classList.contains('active')) {
        closeRadialLauncher();
      } else {
        openRadialLauncher(e.clientX, e.clientY);
      }
    });

    // Close launcher when clicking outside
    document.addEventListener('pointerdown', (e) => {
      if (radialLauncher && radialLauncher.classList.contains('active')) {
        if (!radialLauncher.contains(e.target)) {
          closeRadialLauncher();
        }
      }
    });



    // Connect all radial satellite items to launchInBuiltApp (WV2 in-HUD browser)
    document.querySelectorAll('.radial-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        playSmartClick();
        const url = item.getAttribute('data-url') || item.getAttribute('href');
        const title = item.getAttribute('data-tooltip') || 'App';
        if (url && url !== '#') {
          launchInBuiltApp(e, url, title);
        }
        closeRadialLauncher();
      });
    });

    // =============================================================
    // 3.2. LUXURY CYBERNETIC PRECISION ENGINE (3-SEC STATIONARY MOUSE HOVER)
    // =============================================================
    const cyberCanvas = document.getElementById('cyberneticMouseCanvas');
    const cybCtx = cyberCanvas ? cyberCanvas.getContext('2d', { alpha: true }) : null;
    const blob1 = document.getElementById('blob1');
    const blob2 = document.getElementById('blob2');

    let cybWidth = window.innerWidth;
    let cybHeight = window.innerHeight;
    let cybDpr = 1;

    // Mouse Physics Vector
    const cybMouse = {
      currentX: window.innerWidth * 0.5,
      currentY: window.innerHeight * 0.5,
      targetX: window.innerWidth * 0.5,
      targetY: window.innerHeight * 0.5
    };

    let lastMouseMoveTime = performance.now();
    let cybAlpha = 0.0;
    let lastCybTime = performance.now();

    function resizeCyberneticCanvas() {
      if (!cyberCanvas || !cybCtx) return;
      cybDpr = Math.min(window.devicePixelRatio || 1, 2);
      cybWidth = window.innerWidth;
      cybHeight = window.innerHeight;

      cyberCanvas.width = Math.floor(cybWidth * cybDpr);
      cyberCanvas.height = Math.floor(cybHeight * cybDpr);
      cyberCanvas.style.width = cybWidth + 'px';
      cyberCanvas.style.height = cybHeight + 'px';

      cybCtx.setTransform(1, 0, 0, 1, 0, 0);
      cybCtx.scale(cybDpr, cybDpr);
    }

    // High-Performance Particle Engine (Float32Array Strided Buffer)
    const PARTICLE_COUNT = 240;
    const particles = new Float32Array(PARTICLE_COUNT * 8);
    // Strided format: [x, y, angle, speed, orbitRadius, charFlag, baseAlpha, flashSpeed]

    function initCyberneticParticles() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 8;
        particles[idx] = Math.random() * cybWidth;               // x
        particles[idx + 1] = Math.random() * cybHeight;          // y
        particles[idx + 2] = Math.random() * Math.PI * 2;     // angle
        particles[idx + 3] = 0.008 + Math.random() * 0.012;   // speed
        particles[idx + 4] = 70 + Math.random() * 180;        // orbitRadius
        particles[idx + 5] = Math.random() > 0.5 ? 1 : 0;     // char (1 or 0)
        particles[idx + 6] = 0.15 + Math.random() * 0.45;     // baseAlpha
        particles[idx + 7] = 0.02 + Math.random() * 0.03;     // flashSpeed
      }
    }
    initCyberneticParticles();

    function recordCyberneticMouseMove(clientX, clientY) {
      const dx = clientX - cybMouse.targetX;
      const dy = clientY - cybMouse.targetY;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        lastMouseMoveTime = performance.now();
      }
      cybMouse.targetX = clientX;
      cybMouse.targetY = clientY;
    }

    window.addEventListener('pointermove', (e) => {
      recordCyberneticMouseMove(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('mousemove', (e) => {
      recordCyberneticMouseMove(e.clientX, e.clientY);
    }, { passive: true });

    function animateCyberneticEngine(now) {
      if (!cybCtx) return;

      // True delta calculation (Screen Refresh Independent)
      let dt = (now - lastCybTime) * 0.001;
      lastCybTime = now;
      if (dt > 0.1) dt = 0.1; // Clamp lag spikes

      // Check if mouse has been stationary for 3 seconds
      const stationaryDuration = now - lastMouseMoveTime;
      const isStationary = stationaryDuration >= 3000;

      const targetAlpha = isStationary ? 1.0 : 0.0;
      const fadeRate = 1.0 - Math.exp(-4.5 * dt);
      cybAlpha += (targetAlpha - cybAlpha) * fadeRate;

      if (cybAlpha < 0.005) {
        cybAlpha = 0.0;
        cybCtx.clearRect(0, 0, cybWidth, cybHeight);
        if (blob1 && blob1.classList.contains('active')) blob1.classList.remove('active');
        if (blob2 && blob2.classList.contains('active')) blob2.classList.remove('active');
        if (cyberCanvas && cyberCanvas.classList.contains('active')) cyberCanvas.classList.remove('active');
        return;
      }

      if (blob1 && !blob1.classList.contains('active')) blob1.classList.add('active');
      if (blob2 && !blob2.classList.contains('active')) blob2.classList.add('active');
      if (cyberCanvas && !cyberCanvas.classList.contains('active')) cyberCanvas.classList.add('active');

      // Centralized Mouse Spring Lerp
      const lerpFactor = 1.0 - Math.exp(-9.0 * dt);
      cybMouse.currentX += (cybMouse.targetX - cybMouse.currentX) * lerpFactor;
      cybMouse.currentY += (cybMouse.targetY - cybMouse.currentY) * lerpFactor;

      // Ambient Blob Synced Update
      if (blob1 && blob2) {
        const bX = (cybMouse.currentX - cybWidth * 0.5) * 0.04;
        const bY = (cybMouse.currentY - cybHeight * 0.5) * 0.04;
        blob1.style.transform = `translate3d(${bX}px, ${bY}px, 0)`;
        blob2.style.transform = `translate3d(${-bX}px, ${-bY}px, 0)`;
      }

      cybCtx.clearRect(0, 0, cybWidth, cybHeight);

      // Single Context State for Minimal Overhead
      cybCtx.font = '600 12px "JetBrains Mono", "SF Mono", Monaco, "Cascadia Code", monospace';
      cybCtx.textAlign = 'center';
      cybCtx.textBaseline = 'middle';

      const timeSec = now * 0.001;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 8;

        // Orbit Target Mapping
        particles[idx + 2] += particles[idx + 3] * (dt * 60);
        const targetX = cybMouse.currentX + Math.cos(particles[idx + 2]) * particles[idx + 4];
        const targetY = cybMouse.currentY + Math.sin(particles[idx + 2]) * particles[idx + 4];

        // Smooth Organic Inertia
        const followRate = 1.0 - Math.exp(-3.5 * dt);
        particles[idx] += (targetX - particles[idx]) * followRate;
        particles[idx + 1] += (targetY - particles[idx + 1]) * followRate;

        // Bit Flipping Logic
        if (Math.random() < 0.006) {
          particles[idx + 5] = particles[idx + 5] === 1 ? 0 : 1;
        }

        // Shimmer Alpha Calculation
        const alpha = particles[idx + 6] + Math.sin(timeSec * (particles[idx + 7] * 60)) * 0.2;
        const clampedAlpha = alpha < 0.08 ? 0.08 : (alpha > 0.9 ? 0.9 : alpha);
        const finalAlpha = Math.min(1, Math.max(0, clampedAlpha * cybAlpha));

        if (finalAlpha > 0.01) {
          cybCtx.fillStyle = `rgba(235, 240, 255, ${finalAlpha})`;
          cybCtx.fillText(particles[idx + 5] === 1 ? '1' : '0', particles[idx], particles[idx + 1]);
        }
      }
    }

      const clean = addr.trim();

      if (/^3[a-km-zA-HJ-NP-Z1-9]{32,34}$/.test(clean)) return 'BITCOIN (SEGWIT)';
      if (/^bc1[a-z0-9]{38,62}$/i.test(clean)) return 'BITCOIN (BECH32)';
      return false;
    }

    function isLitecoinAddress(addr) {
      if (!addr) return false;
      const clean = addr.trim();
      return /^[LM3][a-km-zA-HJ-NP-Z1-9]{26,33}$/.test(clean) || /^ltc1[a-z0-9]{39,59}$/i.test(clean);
    }

      // 6. Check EVM Addresses
      if (typeof ethers !== 'undefined' && ethers.utils.isAddress(cleanAddr)) {
        let bestUsdtResult = null;
        let bestNativeResult = null;

        for (const net of NETWORKS) {
          scanStatusMessage.textContent = `PROBING ${net.name}...`;
          try {
            const provider = new ethers.providers.JsonRpcProvider({ url: net.rpc, timeout: 3500 });

            // Check native coin balance
            const rawNative = await provider.getBalance(cleanAddr);
            const nativeBal = parseFloat(ethers.utils.formatEther(rawNative));
            if (nativeBal > 0 && (!bestNativeResult || nativeBal > bestNativeResult.numericBal)) {
              bestNativeResult = { network: net.name, token: net.nativeToken, balance: nativeBal >= 1 ? nativeBal.toFixed(4) : nativeBal.toFixed(6), numericBal: nativeBal };
            }

            // Check USDT contract balance
            const contract = new ethers.Contract(net.usdt, USDT_ABI, provider);
            const rawBal = await contract.balanceOf(cleanAddr);
            const decimals = net.id === 'bsc' ? 18 : 6;
            const usdtBal = parseFloat(ethers.utils.formatUnits(rawBal, decimals));

            if (usdtBal > 0 && (!bestUsdtResult || usdtBal > bestUsdtResult.numericBal)) {
              bestUsdtResult = { network: net.name, token: 'USDT', balance: usdtBal.toFixed(2), numericBal: usdtBal };
            }
          } catch(e) {}
        }

        if (bestUsdtResult) {
          displayCryptoResult(bestUsdtResult.network, bestUsdtResult.token, bestUsdtResult.balance);
          return;
        }
        if (bestNativeResult) {
          displayCryptoResult(bestNativeResult.network, bestNativeResult.token, bestNativeResult.balance);
          return;
        }

        displayCryptoResult('ETHEREUM (ERC 20)', 'ETH', '0.00');
        return;
      }

      displayCryptoResult('MULTI-CHAIN', 'COIN', '0.00');
    }

    function displayCryptoResult(network, token, balance) {
      cryptoScanLoader.style.display = 'none';
      cryptoIntelPanel.style.display = 'flex';
      cryptoNetBadge.textContent = `[ ${network} ]`;
      cryptoBalLabel.textContent = `Total ${token} :`;
      cryptoBalValue.textContent = balance;
    }

    async function autoPasteClipboardToCrypto() {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          const cleanText = text.trim();
          cryptoAddressInput.value = cleanText;
          showToast('CLIPBOARD PASTED & SCANNING');
          interrogateAllChains(cleanText);
        }
      } catch(err) {
        console.log('Clipboard notice:', err);
      }
    }

    if (bitcoinTrigger) {
      bitcoinTrigger.addEventListener('click', async (e) => {
        e.stopPropagation();
        bitcoinInlineBar.classList.toggle('open');
        if (bitcoinInlineBar.classList.contains('open')) {
          cryptoAddressInput.focus();
          await autoPasteClipboardToCrypto();
        }
      });
    }

    if (btnCryptoPaste) {
      btnCryptoPaste.addEventListener('click', async (e) => {
        e.stopPropagation();
        await autoPasteClipboardToCrypto();
      });
    }

    if (cryptoAddressInput) {
      let cryptoDebounce = null;
      cryptoAddressInput.addEventListener('input', () => {
        if (cryptoDebounce) clearTimeout(cryptoDebounce);
        const val = cryptoAddressInput.value.trim();
        if (val.length >= 26) {
          cryptoDebounce = setTimeout(() => {
            interrogateAllChains(val);
          }, 600);
        }
      });

      cryptoAddressInput.addEventListener('paste', () => {
        setTimeout(() => {
          const val = cryptoAddressInput.value.trim();
          if (val) interrogateAllChains(val);
        }, 80);
      });

      cryptoAddressInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (cryptoDebounce) clearTimeout(cryptoDebounce);
          const val = cryptoAddressInput.value.trim();
          if (val) interrogateAllChains(val);
        }
      });
    }

    document.addEventListener('click', (e) => {
      if (bitcoinInlineBar && bitcoinInlineBar.classList.contains('open')) {
        if (!bitcoinCluster.contains(e.target)) {
          bitcoinInlineBar.classList.remove('open');
        }
      }
    });

    // =============================================================
    // 9. LOCAL STORAGE CUSTOM NODES MANAGEMENT
    // =============================================================
    const modalBackdrop = document.getElementById('modalBackdrop');
    const addAppBtnApps = document.getElementById('addAppBtn-apps');
    const addAppBtnBiz = document.getElementById('addAppBtn-biz');
    const btnCancel = document.getElementById('btnCancel');
    const btnSave = document.getElementById('btnSave');
    const appNameInput = document.getElementById('appName');
    const appUrlInput = document.getElementById('appUrl');
    const appIconUrlInput = document.getElementById('appIconUrl');
    const dockTargetSelect = document.getElementById('dockTarget');

    function loadSavedApps() {
      try {
        const saved = JSON.parse(localStorage.getItem('aethelgard_matrix_nodes_v3') || '[]');
        saved.forEach(app => renderCustomApp(app));
      } catch(e) {}
    }

    function renderCustomApp(app) {
      const isBiz = app.dock === 'biz';
      const targetList = isBiz ? document.getElementById('listBiz') : document.getElementById('listApps');
      const addBtn = isBiz ? addAppBtnBiz : addAppBtnApps;

      const a = document.createElement('a');
      a.href = app.url;
      a.className = 'app-btn';
      a.dataset.tooltip = app.name;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      if (app.icon) {
        const img = document.createElement('img');
        img.src = app.icon;
        img.alt = app.name;
        a.appendChild(img);
      } else {
        a.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`;
      }

      a.addEventListener('click', (e) => {
        launchInBuiltApp(e, app.url, app.name);
      });

      targetList.insertBefore(a, addBtn);
    }

    function saveCustomApp(app) {
      try {
        const saved = JSON.parse(localStorage.getItem('aethelgard_matrix_nodes_v3') || '[]');
        saved.push(app);
        localStorage.setItem('aethelgard_matrix_nodes_v3', JSON.stringify(saved));
        renderCustomApp(app);
        showToast(`✓ Node Deployed: ${app.name}`);
      } catch(e) {}
    }

    if (addAppBtnApps) {
      addAppBtnApps.addEventListener('click', () => {
        dockTargetSelect.value = 'apps';
        modalBackdrop.classList.add('open');
        appNameInput.focus();
      });
    }

    if (addAppBtnBiz) {
      addAppBtnBiz.addEventListener('click', () => {
        dockTargetSelect.value = 'biz';
        modalBackdrop.classList.add('open');
        appNameInput.focus();
      });
    }

    btnCancel.addEventListener('click', () => {
      modalBackdrop.classList.remove('open');
      appNameInput.value = '';
      appUrlInput.value = '';
      appIconUrlInput.value = '';
    });

    btnSave.addEventListener('click', () => {
      const name = appNameInput.value.trim();
      const url = appUrlInput.value.trim();
      const icon = appIconUrlInput.value.trim();
      if (!name || !url) return;

      saveCustomApp({ name, url, icon, dock: dockTargetSelect.value });
      btnCancel.click();
    });

    // Cache and load local business app images safely
    const BIZ_APPS_CACHE = [
      { id: 'meta_ads', local: 'assets/meta_ads.jpg' },
      { id: 'google_ads', local: 'assets/google_ads.jpg' },
      { id: 'vercel', local: 'assets/vercel.jpg' },
      { id: 'github', local: 'assets/github.jpg' }
    ];

    function loadBizImages() {
      BIZ_APPS_CACHE.forEach(app => {
        const el = document.getElementById(`bizImg-${app.id}`);
        if (el) el.src = app.local;
      });
    }

    // Initialize Engine
    resize();
    loadBizImages();
    loadSavedApps();
    requestAnimationFrame(render);
  </script>
</body>
</html>
