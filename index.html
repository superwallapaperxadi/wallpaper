<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Focus Engine - Ultra Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;900&family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020204;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --font-display: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-display);
      position: relative;
      cursor: crosshair;
    }

    /* Fixed 60FPS Scanline Grid (Zero paint cost) */
    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 6;
      opacity: 0.35;
      transform: translateZ(0);
    }

    /* Architectural Viewport Frame */
    .frame-border {
      position: fixed;
      inset: 24px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 10;
      transform: translateZ(0);
    }

    .corner-tick {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(255, 255, 255, 0.5);
    }
    .top-left { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .top-right { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .bottom-left { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .bottom-right { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Decoupled GPU Spotlight */
    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 700px;
      height: 700px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 65%);
      z-index: 1;
      transform: translate(-50%, -50%) translateZ(0);
      will-change: transform;
      mix-blend-mode: screen;
    }

    /* Precision Kinetic Reticle */
    .cursor-halo {
      position: fixed;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) translateZ(0);
      z-index: 8;
      will-change: transform;
      transition: width 0.25s ease, height 0.25s ease, border-color 0.2s ease;
    }

    body:active .cursor-halo {
      width: 70px;
      height: 70px;
      border-color: rgba(255, 255, 255, 0.6);
    }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      transform: translateZ(0);
    }

    /* High Density HUD Layer */
    .hud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      padding: 55px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateZ(0);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
    }

    /* Swiss Horology & Mindset Core Cluster */
    .telemetry-cluster {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mindset-block {
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.35);
      line-height: 1.35;
      text-transform: uppercase;
    }

    .mindset-block .bold {
      display: block;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    }

    .time-card {
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      border-radius: 6px;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      width: fit-content;
    }

    .time-main {
      font-family: var(--font-mono);
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .time-main .ampm {
      font-size: 0.7rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 1px;
    }

    .date-sub {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
    }

    /* Sub-second Micro Gauge */
    .second-progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }

    .second-progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      transition: width 0.08s linear;
    }

    .sanskrit-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2rem;
      letter-spacing: 7px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 200;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
      padding: 7px 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(14px);
      border-radius: 40px;
    }

    .top-right-metrics {
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.35);
    }

    .metric-chip {
      padding: 6px 14px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      border-radius: 4px;
    }

    .metric-chip span {
      color: #ffffff;
      font-weight: 700;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .system-status {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      line-height: 1.8;
    }

    .pulse-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 10px #00ff88;
      animation: pulse 2.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .system-status .live-counter {
      color: #ffffff;
      font-weight: 700;
    }

    .dont-quit {
      text-align: right;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 3.5px;
      color: rgba(255, 255, 255, 0.12);
      line-height: 1.15;
    }

    .dont-quit span.highlight {
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 900px) {
      .hud-layer { padding: 30px; }
      .sanskrit-title, .top-right-metrics { display: none; }
      .frame-border { inset: 12px; }
    }
  </style>
</head>
<body>

  <div class="frame-border">
    <div class="corner-tick top-left"></div>
    <div class="corner-tick top-right"></div>
    <div class="corner-tick bottom-left"></div>
    <div class="corner-tick bottom-right"></div>
  </div>

  <div class="scanlines"></div>
  <div class="cursor-halo" id="cursorHalo"></div>
  <div class="spotlight" id="spotlight"></div>
  <canvas id="stage"></canvas>

  <div class="hud-layer">
    <div class="top-row">
      <!-- Luxury Left Telemetry & Mindset Block -->
      <div class="telemetry-cluster">
        <div class="mindset-block">
          MINDSET<br>
          <span class="bold">IS EVERYTHING</span>
        </div>
        
        <div class="time-card">
          <div class="time-main">
            <span id="clockTime">00:00:00</span>
            <span class="ampm" id="clockAmPm">AM</span>
          </div>
          <div class="date-sub" id="clockDate">INITIALIZING...</div>
          <div class="second-progress-track">
            <div class="second-progress-fill" id="secGauge"></div>
          </div>
        </div>
      </div>

      <div class="sanskrit-title">
        सर्वं सम्भाव्यते त्वयि ।
      </div>

      <div class="top-right-metrics">
        <div class="metric-chip">BUFFER <span id="memIndicator">STATIC</span></div>
        <div class="metric-chip">FPS <span id="fpsCounter">60</span></div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="system-status">
        <span class="pulse-dot"></span>QUANTUM FOCUS ENGINE<br>
        [SESSION LOCK] <span id="sessionTimer" class="live-counter">00:00:00.0</span>
      </div>

      <div class="dont-quit">
        <span class="highlight">DO</span>N'T<br>
        QU<span class="highlight">IT!</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const spotlight = document.getElementById('spotlight');
    const cursorHalo = document.getElementById('cursorHalo');
    const timerElem = document.getElementById('sessionTimer');
    const fpsElem = document.getElementById('fpsCounter');
    
    // Live Clock Nodes
    const clockTimeElem = document.getElementById('clockTime');
    const clockAmPmElem = document.getElementById('clockAmPm');
    const clockDateElem = document.getElementById('clockDate');
    const secGauge = document.getElementById('secGauge');

    let width = 0, height = 0;
    const mouse = { x: -2000, y: -2000, radius: 150, isDown: false, prevX: 0, prevY: 0, speed: 0 };

    // ==========================================
    // ZERO-GARBAGE FLAT MEMORY BUFFERS
    // ==========================================
    // Particles Buffer: [x, y, originX, originY, vx, vy]
    let particleCount = 0;
    let particleBuffer = null;
    const P_STRIDE = 6;

    // Stars Buffer: [x, y, size, alpha, twinkleSpeed]
    let starCount = 0;
    let starBuffer = null;
    const S_STRIDE = 5;

    // Fixed Ring Buffer for Shockwaves (Max 4 concurrent, avoids array allocations)
    const MAX_SHOCKWAVES = 4;
    const shockwaveBuffer = new Float32Array(MAX_SHOCKWAVES * 4); // [x, y, radius, alpha]
    let shockwaveIndex = 0;

    // Real-Time Clock & Sub-second Progression
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    let lastClockUpdate = 0;

    function updateLiveClock(nowMs) {
      if (nowMs - lastClockUpdate < 100) return;
      lastClockUpdate = nowMs;

      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = now.getSeconds();
      const ms = now.getMilliseconds();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      hours = hours % 12 || 12;
      clockTimeElem.textContent = `${String(hours).padStart(2, '0')}:${minutes}:${String(seconds).padStart(2, '0')}`;
      clockAmPmElem.textContent = ampm;

      // Smooth 60-second micro-bar
      const secProgress = ((seconds + ms / 1000) / 60) * 100;
      secGauge.style.width = `${secProgress.toFixed(1)}%`;

      clockDateElem.textContent = `${days[now.getDay()]} • ${String(now.getDate()).padStart(2, '0')} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }

    // Precise Session Watch
    const sessionStart = performance.now();
    function updateTimer(now) {
      const elapsed = now - sessionStart;
      const ms = Math.floor((elapsed % 1000) / 100);
      const s = Math.floor((elapsed / 1000) % 60);
      const m = Math.floor((elapsed / (1000 * 60)) % 60);
      const h = Math.floor(elapsed / (1000 * 60 * 60));
      timerElem.textContent = 
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
    }

    // Audio Engine: Single Shared Instance (528Hz Solfeggio)
    let audioCtx = null;
    function initAtmosphericAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(132, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.015, audioCtx.currentTime);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(198, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.01, audioCtx.currentTime);

        osc1.connect(gain1);
        osc2.connect(gain2);
        gain1.connect(audioCtx.destination);
        gain2.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
      } catch(e) {}
    }

    function init() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      // 1. Initialize Flat Memory for Stars
      starCount = Math.floor((width * height) / 4500);
      starBuffer = new Float32Array(starCount * S_STRIDE);
      for (let i = 0; i < starCount; i++) {
        const offset = i * S_STRIDE;
        starBuffer[offset] = Math.random() * width;
        starBuffer[offset + 1] = Math.random() * height;
        starBuffer[offset + 2] = Math.random() < 0.94 ? Math.random() * 1.0 + 0.3 : Math.random() * 1.8 + 1.0;
        starBuffer[offset + 3] = Math.random() * 0.6 + 0.1; // Alpha
        starBuffer[offset + 4] = Math.random() * 0.01 + 0.004; // Speed
      }

      // 2. Rasterize Typography to Flat Memory
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const offCtx = offscreen.getContext('2d', { willReadFrequently: true });

      const baseFont = Math.min(width * 0.11, 140);
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';

      // DO MORE.
      offCtx.font = `900 ${baseFont * 0.5}px "Plus Jakarta Sans", sans-serif`;
      offCtx.letterSpacing = "8px";
      offCtx.fillText("DO MORE.", width / 2, height / 2 - baseFont * 0.42);

      // FOCUS
      offCtx.font = `900 ${baseFont}px "Plus Jakarta Sans", sans-serif`;
      offCtx.letterSpacing = "6px";
      offCtx.fillText("FOCUS", width / 2, height / 2 + baseFont * 0.36);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      const step = 6; // Optimized spatial grid for Lively Wallpaper background
      const tempCoords = [];

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const alphaIndex = (y * width + x) * 4 + 3;
          if (imgData[alphaIndex] > 140) {
            tempCoords.push(x, y);
          }
        }
      }

      particleCount = tempCoords.length / 2;
      particleBuffer = new Float32Array(particleCount * P_STRIDE);

      for (let i = 0; i < particleCount; i++) {
        const pOffset = i * P_STRIDE;
        const tx = tempCoords[i * 2];
        const ty = tempCoords[i * 2 + 1];

        particleBuffer[pOffset] = tx + (Math.random() - 0.5) * 40;     // current x
        particleBuffer[pOffset + 1] = ty + (Math.random() - 0.5) * 40; // current y
        particleBuffer[pOffset + 2] = tx;                             // origin x
        particleBuffer[pOffset + 3] = ty;                             // origin y
        particleBuffer[pOffset + 4] = 0;                              // vx
        particleBuffer[pOffset + 5] = 0;                              // vy
      }
    }

    // Trigger Shockwave in Ring Buffer
    function triggerShockwave(x, y) {
      const offset = shockwaveIndex * 4;
      shockwaveBuffer[offset] = x;
      shockwaveBuffer[offset + 1] = y;
      shockwaveBuffer[offset + 2] = 5;    // Initial radius
      shockwaveBuffer[offset + 3] = 0.55; // Initial alpha
      shockwaveIndex = (shockwaveIndex + 1) % MAX_SHOCKWAVES;
    }

    let lastFrame = performance.now();
    let frameCount = 0;

    function animate(now) {
      // 1. Direct Background Fill (Fastest clear pattern)
      ctx.fillStyle = '#020204';
      ctx.fillRect(0, 0, width, height);

      // 2. Update Clocks & Timers
      updateLiveClock(now);
      updateTimer(now);

      // 3. Render Stars (Single Batch Loop)
      for (let i = 0; i < starCount; i++) {
        const o = i * S_STRIDE;
        let alpha = starBuffer[o + 3] + starBuffer[o + 4];
        if (alpha > 0.75 || alpha < 0.08) starBuffer[o + 4] = -starBuffer[o + 4];
        starBuffer[o + 3] = alpha;

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
        const size = starBuffer[o + 2];
        ctx.fillRect(starBuffer[o], starBuffer[o + 1], size, size);
      }

      // 4. Render Active Shockwaves
      for (let i = 0; i < MAX_SHOCKWAVES; i++) {
        const o = i * 4;
        const alpha = shockwaveBuffer[o + 3];
        if (alpha > 0.01) {
          shockwaveBuffer[o + 2] += 12; // radius += speed
          shockwaveBuffer[o + 3] *= 0.93; // alpha decay

          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(shockwaveBuffer[o], shockwaveBuffer[o + 1], shockwaveBuffer[o + 2], 0, 6.283);
          ctx.stroke();
        }
      }

      // 5. Update & Render Kinetic Particle Typography
      const mRadius = mouse.radius;
      const mRadiusSq = mRadius * mRadius;
      const isMouseDown = mouse.isDown;
      const mX = mouse.x;
      const mY = mouse.y;
      const mSpeed = mouse.speed;

      for (let i = 0; i < particleCount; i++) {
        const o = i * P_STRIDE;
        let px = particleBuffer[o];
        let py = particleBuffer[o + 1];
        const ox = particleBuffer[o + 2];
        const oy = particleBuffer[o + 3];
        let vx = particleBuffer[o + 4];
        let vy = particleBuffer[o + 5];

        const dx = mX - px;
        const dy = mY - py;
        const distSq = dx * dx + dy * dy;

        if (distSq < mRadiusSq && distSq > 0.01) {
          const dist = Math.sqrt(distSq);
          const force = (mRadius - dist) / mRadius;

          if (isMouseDown) {
            // Orbital pull
            const angle = Math.atan2(dy, dx) + 1.57;
            vx += (dx / dist) * force * 14 + Math.cos(angle) * force * 10;
            vy += (dy / dist) * force * 14 + Math.sin(angle) * force * 10;
          } else {
            // High velocity repulsion
            const angle = Math.atan2(dy, dx);
            const push = force * 22 * (1 + mSpeed * 0.04);
            vx -= Math.cos(angle) * push;
            vy -= Math.sin(angle) * push;
          }
        }

        // Return vector with friction and spring damping
        vx += (ox - px) * 0.075;
        vy += (oy - py) * 0.075;
        vx *= 0.85;
        vy *= 0.85;

        px += vx;
        py += vy;

        particleBuffer[o] = px;
        particleBuffer[o + 1] = py;
        particleBuffer[o + 4] = vx;
        particleBuffer[o + 5] = vy;

        // Chromatic split on fast movement
        const velSq = vx * vx + vy * vy;
        if (velSq > 36) {
          const shift = Math.min(Math.sqrt(velSq) * 0.4, 4.0);
          ctx.fillStyle = 'rgba(255, 40, 60, 0.65)';
          ctx.fillRect(px - shift, py, 2.2, 2.2);
          ctx.fillStyle = 'rgba(30, 200, 255, 0.65)';
          ctx.fillRect(px + shift, py, 2.2, 2.2);
        }

        // Core White Node
        ctx.fillStyle = distSq < mRadiusSq ? '#ffffff' : 'rgba(255, 255, 255, 0.68)';
        ctx.fillRect(px - 1.1, py - 1.1, 2.2, 2.2);
      }

      mouse.speed *= 0.85;

      // 6. Real-time Framerate Meter
      frameCount++;
      if (now - lastFrame >= 1000) {
        fpsElem.textContent = frameCount;
        frameCount = 0;
        lastFrame = now;
      }

      requestAnimationFrame(animate);
    }

    // Hardware Event Handlers
    window.addEventListener('resize', init);

    window.addEventListener('mousemove', (e) => {
      mouse.speed = Math.hypot(e.clientX - mouse.prevX, e.clientY - mouse.prevY);
      mouse.prevX = mouse.x = e.clientX;
      mouse.prevY = mouse.y = e.clientY;

      // GPU Transform Updates (Bypasses CSS Layout recalculations)
      spotlight.style.transform = `translate(${e.clientX - 350}px, ${e.clientY - 350}px) translateZ(0)`;
      cursorHalo.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translateZ(0)`;
    });

    window.addEventListener('mousedown', (e) => {
      mouse.isDown = true;
      initAtmosphericAudio();
      triggerShockwave(e.clientX, e.clientY);

      // Radial impulse to particles
      for (let i = 0; i < particleCount; i++) {
        const o = i * P_STRIDE;
        const dx = particleBuffer[o] - e.clientX;
        const dy = particleBuffer[o + 1] - e.clientY;
        const distSq = dx * dx + dy * dy;
        if (distSq < 78400 && distSq > 0.01) { // 280px radius squared
          const dist = Math.sqrt(distSq);
          const push = (1 - dist / 280) * 45;
          particleBuffer[o + 4] += (dx / dist) * push;
          particleBuffer[o + 5] += (dy / dist) * push;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      mouse.isDown = false;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = -2000;
      mouse.y = -2000;
      mouse.isDown = false;
    });

    init();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
