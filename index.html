<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Core Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.16);
      --glass: rgba(255, 255, 255, 0.02);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font-main);
      color: #ffffff;
      cursor: none;
      position: relative;
    }

    /* Pixel-Perfect Center-Locked Custom Reticle */
    .cursor-center-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      will-change: transform;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .cursor-ambient-halo {
      position: fixed;
      top: 0;
      left: 0;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99;
      will-change: transform, width, height, border-color;
      transition: width 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.2s ease,
                  background-color 0.2s ease;
    }

    body:active .cursor-ambient-halo {
      width: 68px;
      height: 68px;
      border-color: rgba(255, 255, 255, 0.8);
      background-color: rgba(255, 255, 255, 0.03);
    }

    /* Architectural Frame Lines */
    .view-frame {
      position: fixed;
      inset: 28px;
      border: 1px solid var(--border-subtle);
      pointer-events: none;
      z-index: 5;
    }

    .corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .c-tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .c-tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .c-bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .c-br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Swiss Clean HUD */
    .hud {
      position: absolute;
      inset: 0;
      padding: 60px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand-cluster {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-name {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
    }

    /* Minimal Time Block */
    .clock-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .time-digits {
      font-family: var(--font-mono);
      font-size: 2.1rem;
      font-weight: 400;
      letter-spacing: 3px;
      color: #ffffff;
      line-height: 1;
    }

    .time-date {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
    }

    .row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .telemetry {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pip {
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
    }

    .axiom {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 800px) {
      .hud { padding: 36px; }
      .view-frame { inset: 14px; }
      .brand-sub, .axiom { display: none; }
      .time-digits { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="cursor-center-dot" id="cursorDot"></div>
  <div class="cursor-ambient-halo" id="cursorHalo"></div>

  <div class="view-frame">
    <div class="corner c-tl"></div>
    <div class="corner c-tr"></div>
    <div class="corner c-bl"></div>
    <div class="corner c-br"></div>
  </div>

  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="row-top">
      <div class="brand-cluster">
        <span class="brand-name">Kinetic Frame</span>
        <span class="brand-sub">Direct GPU Buffer Execution</span>
      </div>
      <div class="clock-cluster">
        <div class="time-digits" id="clockDigits">00:00:00</div>
        <div class="time-date" id="clockDate">INITIALIZING</div>
      </div>
    </div>

    <div class="row-bottom">
      <div class="telemetry">
        <span class="pip"></span>
        <span>UPTIME</span>
        <span id="sessionTimer" style="color: #ffffff;">00:00:00</span>
      </div>
      <div class="axiom">FOCUS IS A VECTOR</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const cursorDot = document.getElementById('cursorDot');
    const cursorHalo = document.getElementById('cursorHalo');
    const clockDigits = document.getElementById('clockDigits');
    const clockDate = document.getElementById('clockDate');
    const sessionTimer = document.getElementById('sessionTimer');

    let width = 0;
    let height = 0;

    // Mouse Tracking (Target vs Physics Position)
    const mouse = {
      x: -2000,
      y: -2000,
      tx: -2000,
      ty: -2000,
      radius: 155,
      isDown: false,
      speed: 0,
      prevX: 0,
      prevY: 0
    };

    // Particles Flat Buffer: [x, y, originX, originY, vx, vy, size, alpha]
    const STRIDE = 8;
    let pCount = 0;
    let pBuffer = null;

    // Shockwave Ring Buffer: [x, y, radius, maxRadius, alpha]
    const MAX_SHOCKS = 3;
    const shocks = new Float32Array(MAX_SHOCKS * 5);
    let shockIdx = 0;

    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const startTime = performance.now();

    function updateClock(now) {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');

      clockDigits.textContent = `${h}:${m}:${s}`;
      clockDate.textContent = `${days[d.getDay()]} / ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;

      const sec = Math.floor((now - startTime) / 1000);
      const sh = String(Math.floor(sec / 3600)).padStart(2, '0');
      const sm = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      sessionTimer.textContent = `${sh}:${sm}:${ss}`;
    }

    function initTypography() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      const off = document.createElement('canvas');
      off.width = width;
      off.height = height;
      const offCtx = off.getContext('2d');

      const fontSize = Math.min(width * 0.125, 150);
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.font = `900 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
      offCtx.fillText('FOCUS', width / 2, height / 2);

      const img = offCtx.getImageData(0, 0, width, height).data;
      const step = Math.max(Math.floor(width / 340), 4);
      const coords = [];

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const idx = (y * width + x) * 4 + 3;
          if (img[idx] > 128) {
            coords.push(x, y);
          }
        }
      }

      pCount = coords.length / 2;
      pBuffer = new Float32Array(pCount * STRIDE);

      for (let i = 0; i < pCount; i++) {
        const o = i * STRIDE;
        const ox = coords[i * 2];
        const oy = coords[i * 2 + 1];

        pBuffer[o] = ox + (Math.random() - 0.5) * 30;
        pBuffer[o + 1] = oy + (Math.random() - 0.5) * 30;
        pBuffer[o + 2] = ox;
        pBuffer[o + 3] = oy;
        pBuffer[o + 4] = 0;
        pBuffer[o + 5] = 0;
        pBuffer[o + 6] = Math.random() * 1.3 + 0.9;
        pBuffer[o + 7] = Math.random() * 0.35 + 0.55;
      }
    }

    function addShockwave(x, y) {
      const o = shockIdx * 5;
      shocks[o] = x;
      shocks[o + 1] = y;
      shocks[o + 2] = 2;   // radius
      shocks[o + 3] = 320; // maxRadius
      shocks[o + 4] = 0.75; // alpha
      shockIdx = (shockIdx + 1) % MAX_SHOCKS;
    }

    let prevTime = performance.now();

    function render(now) {
      const dt = Math.min((now - prevTime) / 1000, 0.033);
      prevTime = now;

      // Mouse Interpolation
      mouse.x += (mouse.tx - mouse.x) * 0.22;
      mouse.y += (mouse.ty - mouse.y) * 0.22;

      // Center-Lock Custom Cursor Transform
      cursorDot.style.transform = `translate3d(${mouse.tx - 2.5}px, ${mouse.ty - 2.5}px, 0)`;
      cursorHalo.style.transform = `translate3d(${mouse.x - cursorHalo.offsetWidth * 0.5}px, ${mouse.y - cursorHalo.offsetHeight * 0.5}px, 0)`;

      // Pure Black Canvas Clear
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      updateClock(now);

      // Render Active Shockwaves
      for (let i = 0; i < MAX_SHOCKS; i++) {
        const o = i * 5;
        const alpha = shocks[o + 4];
        if (alpha > 0.01) {
          shocks[o + 2] += (shocks[o + 3] - shocks[o + 2]) * 0.12;
          shocks[o + 4] *= 0.93;

          ctx.save();
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(shocks[o], shocks[o + 1], shocks[o + 2], 0, 6.283);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Particle Physics Engine
      const mx = mouse.x;
      const my = mouse.y;
      const mRad = mouse.radius;
      const mRadSq = mRad * mRad;
      const isDown = mouse.isDown;
      const speedMult = Math.min(mouse.speed * 0.04, 3.5);

      for (let i = 0; i < pCount; i++) {
        const o = i * STRIDE;
        let px = pBuffer[o];
        let py = pBuffer[o + 1];
        const ox = pBuffer[o + 2];
        const oy = pBuffer[o + 3];
        let vx = pBuffer[o + 4];
        let vy = pBuffer[o + 5];
        const size = pBuffer[o + 6];
        const alpha = pBuffer[o + 7];

        const dx = mx - px;
        const dy = my - py;
        const distSq = dx * dx + dy * dy;

        // Force calculations
        if (distSq < mRadSq && distSq > 0.01) {
          const dist = Math.sqrt(distSq);
          const force = (1 - dist / mRad);

          if (isDown) {
            // Implode / Vortex
            const angle = Math.atan2(dy, dx) + 1.57;
            vx += (dx / dist) * force * 30 + Math.cos(angle) * force * 15;
            vy += (dy / dist) * force * 30 + Math.sin(angle) * force * 15;
          } else {
            // Explosive dispersal
            const angle = Math.atan2(dy, dx);
            const push = force * (18 + speedMult * 8);
            vx -= Math.cos(angle) * push;
            vy -= Math.sin(angle) * push;
          }
        }

        // Viscous Spring Damping
        const spring = 8.8;
        const damping = Math.pow(0.83, dt * 60);

        vx += (ox - px) * spring * dt;
        vy += (oy - py) * spring * dt;
        vx *= damping;
        vy *= damping;

        px += vx;
        py += vy;

        pBuffer[o] = px;
        pBuffer[o + 1] = py;
        pBuffer[o + 4] = vx;
        pBuffer[o + 5] = vy;

        // Kinetic glow on movement
        const vel = Math.hypot(vx, vy);
        const finalAlpha = Math.min(alpha + vel * 0.05, 1.0);

        ctx.fillStyle = finalAlpha > 0.85 ? '#ffffff' : `rgba(255, 255, 255, ${finalAlpha.toFixed(2)})`;
        ctx.fillRect(px - size * 0.5, py - size * 0.5, size, size);
      }

      mouse.speed *= 0.88;
      requestAnimationFrame(render);
    }

    // Hardware Event Handlers
    window.addEventListener('resize', initTypography);

    window.addEventListener('mousemove', (e) => {
      mouse.speed = Math.hypot(e.clientX - mouse.prevX, e.clientY - mouse.prevY);
      mouse.prevX = mouse.tx = e.clientX;
      mouse.prevY = mouse.ty = e.clientY;
    });

    window.addEventListener('mousedown', (e) => {
      mouse.isDown = true;
      mouse.radius = 240;
      addShockwave(e.clientX, e.clientY);

      // Radial shockwave impulse to particles
      for (let i = 0; i < pCount; i++) {
        const o = i * STRIDE;
        const dx = pBuffer[o] - e.clientX;
        const dy = pBuffer[o + 1] - e.clientY;
        const distSq = dx * dx + dy * dy;
        if (distSq < 62500 && distSq > 1) {
          const dist = Math.sqrt(distSq);
          const push = (1 - dist / 250) * 48;
          pBuffer[o + 4] += (dx / dist) * push;
          pBuffer[o + 5] += (dy / dist) * push;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      mouse.isDown = false;
      mouse.radius = 155;
    });

    window.addEventListener('mouseleave', () => {
      mouse.tx = -2000;
      mouse.ty = -2000;
      mouse.isDown = false;
    });

    initTypography();
    requestAnimationFrame(render);
  </script>
</body>
</html>
